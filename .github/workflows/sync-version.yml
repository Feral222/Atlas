
name: Sync Atlas release headings
on:
  push:
    branches: [main]
    paths:
      - index.html
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-version-sync-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Synchronize headings from index.html
        run: node scripts/sync-version.cjs
      - name: Commit only changed documentation headings
        run: |
          if git diff --quiet -- README.md .gitignore; then
            echo 'Version headings already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md .gitignore
          git commit -m 'chore: sync Atlas release headings'
          git push origin HEAD:main
  
