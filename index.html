<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<title>ATLAS 0.3.3</title>
<style>
:root{--bg:#07111c;--panel:#0d1b2a;--panel2:#122337;--text:#eef4fb;--muted:#9fb0c2;--gold:#d6b66b;--gold2:#f1d78e;--line:rgba(255,255,255,.08);--shadow:0 18px 50px rgba(0,0,0,.28);--ok:#5fc58a;--danger:#e46d6d;--warn:#e0ad5d}
:root.light{--bg:#eef2f7;--panel:#fff;--panel2:#f6f8fb;--text:#132235;--muted:#66788d;--gold:#9a7625;--gold2:#c49a3c;--line:rgba(19,34,53,.10);--shadow:0 18px 50px rgba(34,55,80,.12)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:286px;background:linear-gradient(180deg,var(--panel),#091522);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:13px;align-items:center;padding:4px 6px 22px}.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#112033;font-weight:900;font-size:24px;box-shadow:var(--shadow)}.brand h1{margin:0;font-size:22px;letter-spacing:.18em}.brand p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.35;max-width:180px}.version{display:inline-block;margin-top:4px;color:var(--gold);font-size:10px}.nav-list{display:grid;gap:6px;overflow:auto}.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left}.nav-item:hover,.nav-item.active{background:rgba(214,182,107,.12);color:var(--gold2)}.nav-icon{width:26px;text-align:center}.sidebar-footer{margin-top:auto;display:grid;gap:8px;padding-top:10px}
.ghost-btn,.file-label{border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:center}.main{margin-left:286px;min-height:100vh;padding:20px 26px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:env(safe-area-inset-top);background:rgba(7,17,28,.88);backdrop-filter:blur(18px);padding:10px 0 18px;z-index:10}.light .topbar{background:rgba(238,242,247,.88)}.topbar h2{margin:3px 0 0;font-size:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold)}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:12px}.hero{display:grid;gap:12px;margin-bottom:22px}.search-wrap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 16px;box-shadow:var(--shadow)}.search-wrap input{width:100%;padding:15px 0;border:0;outline:0;background:transparent;color:var(--text)}.voice-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid rgba(214,182,107,.25);padding:14px;border-radius:18px}.mic-btn{width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 0 rgba(214,182,107,.35);font-size:24px}.mic-btn.listening{animation:pulse 1.15s infinite}@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(214,182,107,0)}100%{box-shadow:0 0 0 0 rgba(214,182,107,0)}}.voice-title{font-weight:800}.voice-status{color:var(--muted);font-size:13px;margin-top:4px}.primary-btn{border:0;border-radius:12px;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px}.danger-btn{border:1px solid rgba(228,109,109,.35);background:transparent;color:var(--danger);border-radius:10px;padding:8px 10px}textarea{resize:vertical;min-height:60px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;outline:0}
.grid{display:grid;gap:14px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 10px;font-size:16px}.card .big{font-size:30px;font-weight:900;color:var(--gold2)}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.section-title h3{margin:0}.quick-card{display:flex;gap:13px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:16px}.quick-icon{font-size:26px}.list{display:grid;gap:9px}.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}.list-item.done .item-title{text-decoration:line-through;opacity:.6}.item-title{font-weight:700}.check{width:20px;height:20px}.small-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .wide{grid-column:1/-1}.form-grid input,.form-grid select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);margin:2px}.pill.high{color:#ff9b9b}.pill.medium{color:#ffd18b}.pill.low{color:#8fd7ab}.mobile-nav{display:none}.mobile-only{display:none}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#111d2b;color:#fff;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.doc-preview{width:54px;height:54px;border-radius:10px;background:var(--panel);display:grid;place-items:center;overflow:hidden}.doc-preview img{width:100%;height:100%;object-fit:cover}.timeline{position:relative;padding-left:24px}.timeline:before{content:"";position:absolute;left:11px;top:18px;bottom:18px;width:2px;background:var(--line)}.timeline-item{position:relative;margin-bottom:18px}.timeline-item:before{content:"";position:absolute;left:-18px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--gold)}.badge-ok{color:var(--ok)}.upload-zone{border:1px dashed rgba(214,182,107,.45);border-radius:16px;padding:18px;text-align:center;background:rgba(214,182,107,.05)}.upload-zone input{display:none}.upload-label{display:inline-block;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px;border-radius:12px}.record-body{white-space:pre-wrap;line-height:1.5}.kicker{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
.field-label{display:block;font-size:12px;font-weight:800;color:var(--gold);margin:2px 0 6px}.field-help{font-size:12px;color:var(--muted);margin-top:6px}.calendar-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text)}.calendar-option input{width:20px;height:20px}
.task-action{min-width:150px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px}.edit-banner{border:1px solid rgba(214,182,107,.35);background:rgba(214,182,107,.08);padding:12px 14px;border-radius:12px;margin-bottom:12px}.button-row{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:1050px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}.mobile-only{display:inline-grid;place-items:center}.topbar h2{font-size:23px}.grid.cols-4,.grid.cols-3,.grid.cols-2,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(13,27,42,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}.mobile-nav .nav-item{display:grid;place-items:center;gap:2px;padding:5px 2px;font-size:10px}.mobile-nav .nav-icon{font-size:18px}.voice-card{grid-template-columns:auto 1fr}.voice-card .primary-btn{grid-column:1/-1}.list-item{grid-template-columns:auto 1fr}.list-item> :last-child{grid-column:2}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">A</div><div><h1>ATLAS</h1><p>Advanced Tracking, Library & Archival System</p><span class="version">0.3.3</span></div></div>
  <nav id="desktopNav" class="nav-list"></nav>
  <div class="sidebar-footer">
    <button class="ghost-btn" id="exportBtn">Export backup</button>
    <label class="ghost-btn file-label">Import backup<input id="importInput" type="file" accept="application/json" hidden></label>
  </div>
</aside>
<main class="main">
  <header class="topbar"><button class="icon-btn mobile-only" id="menuBtn">☰</button><div><div class="eyebrow" id="greeting"></div><h2 id="pageTitle">Command Center</h2></div><button class="icon-btn" id="themeBtn">◐</button></header>
  <section class="hero">
    <div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Search tasks, notes, records, documents, people and events…" autocomplete="off"></div>
    <div class="voice-card"><button id="micBtn" class="mic-btn">🎤</button><div><div class="voice-title">Talk to ATLAS</div><div id="voiceStatus" class="voice-status">Tap the microphone, then speak a command.</div></div><button id="runCommandBtn" class="primary-btn">Run</button></div>
    <textarea id="commandInput" rows="2" placeholder='Try: “Atlas, add a task to call the mechanic”'></textarea>
  </section>
  <section id="content"></section>
</main>
<nav id="mobileNav" class="mobile-nav"></nav>
<div id="toast" class="toast"></div>

<script>
const VERSION="0.3.3";
const NAV=[["home","⌂","Home"],["inbox","✉","Inbox"],["actions","✓","Action Center"],["library","🗂","Library"],["timeline","◷","Timeline"],["medical","✚","Medical"],["legal","⚖","Legal"],["housing","⌂","Housing"],["finance","$","Finance"],["vehicles","🚗","Vehicles"],["pets","🐈","Pets"],["people","👥","People"],["knowledge","📚","Knowledge"],["settings","⚙","Settings"]];
const AREAS=["General","Medical","Legal","Housing","Finance","Vehicles","Pets","People","Knowledge"];
const defaults={version:3,tasks:[{id:"seed1",title:"Follow up on BMW claim",done:false,area:"Legal",due:"",priority:"high"},{id:"seed2",title:"Review LADWP payment arrangement",done:false,area:"Housing",due:"",priority:"medium"},{id:"seed3",title:"Track kitten vaccinations",done:false,area:"Pets",due:"",priority:"medium"}],notes:[],events:[{id:"event1",date:"2026-05-03",title:"BMW collision",area:"Vehicles",details:"Rear collision; vehicle became undrivable."}],people:[{id:"p1",name:"Luis",relationship:"Partner",notes:"Household member"},{id:"p2",name:"Gerardo Zaldivar",relationship:"LACDA caseworker",notes:"Housing contact"}],records:[],sections:{medical:["Providers","Medications","Lab results","Procedures","Insurance"],legal:["Active matters","Evidence","Correspondence","Deadlines","Contacts"],housing:["Lease","LACDA","Utilities","Repairs","Inspections"],finance:["Banking","Bills","Benefits","Receipts","Taxes"],vehicles:["BMW","E-bikes","Scooter","Insurance","Maintenance"],pets:["Profiles","Vaccinations","Vet records","Photos","Medications"],knowledge:["Reference notes","Research","How-to guides","Important records"]}};
const $=s=>document.querySelector(s),content=$("#content"),pageTitle=$("#pageTitle"),commandInput=$("#commandInput"),micBtn=$("#micBtn"),voiceStatus=$("#voiceStatus");
let currentPage="home",docs=[],editingTaskId=null,customCategories=JSON.parse(localStorage.getItem("atlasCustomCategories")||"[]");
function clone(o){return JSON.parse(JSON.stringify(o))}
function normalize(raw){const b=clone(defaults);raw=raw&&typeof raw==="object"?raw:{};return{version:3,tasks:Array.isArray(raw.tasks)?raw.tasks.map(t=>({id:String(t.id||uid()),title:String(t.title||"Untitled task"),done:!!t.done,area:t.area||"General",due:t.due||"",priority:t.priority||"medium"})):b.tasks,notes:Array.isArray(raw.notes)?raw.notes:[],events:Array.isArray(raw.events)?raw.events:[],people:Array.isArray(raw.people)?raw.people:[],records:Array.isArray(raw.records)?raw.records:[],sections:raw.sections||b.sections}}
function loadData(){for(const key of ["atlasDataV3","atlasDataV2","atlasData"]){const x=localStorage.getItem(key);if(x){try{const d=normalize(JSON.parse(x));localStorage.setItem("atlasDataV3",JSON.stringify(d));return d}catch{}}}return clone(defaults)}
let data=loadData();
function save(){localStorage.setItem("atlasDataV3",JSON.stringify(data))}
function uid(p="id"){return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function fmt(d){if(!d)return"";const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function allCategories(){return [...new Set([...AREAS,...customCategories])]}
function areaOpts(sel=""){return `<option value="" ${sel?"":"selected"} disabled>Category</option>`+allCategories().map(a=>`<option value="${esc(a)}" ${a===sel?"selected":""}>${esc(a)}</option>`).join("")+`<option value="__new__">＋ Add a new category…</option>`}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("atlasFiles",1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("documents"))db.createObjectStore("documents",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadDocs(){try{const db=await openDB();docs=await new Promise((res,rej)=>{const r=db.transaction("documents").objectStore("documents").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});render()}catch(e){console.error(e)}}
async function putDoc(doc){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction("documents","readwrite").objectStore("documents").put(doc);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
async function deleteDoc(id){const db=await openDB();await new Promise((res,rej)=>{const r=db.transaction("documents","readwrite").objectStore("documents").delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)});await loadDocs();toast("Document deleted")}
function renderNav(){const make=a=>a.map(([id,ic,l])=>`<button class="nav-item ${currentPage===id?"active":""}" data-page="${id}"><span class="nav-icon">${ic}</span><span>${l}</span></button>`).join("");$("#desktopNav").innerHTML=make(NAV);$("#mobileNav").innerHTML=make(NAV.slice(0,5));document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){if(p!=="actions")editingTaskId=null;currentPage=p;$("#sidebar").classList.remove("open");$("#globalSearch").value="";renderNav();render()}
function greet(){const h=new Date().getHours();$("#greeting").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+" • ATLAS "+VERSION}
function taskList(ts){if(!ts.length)return`<div class="empty">Nothing here yet.</div>`;return`<div class="list">${ts.map(t=>`<div class="list-item ${t.done?"done":""}"><div>☐</div><div><div class="item-title">${esc(t.title)}</div><span class="pill">${esc(t.area)}</span><span class="pill ${esc(t.priority)}">${esc(t.priority)}</span>${t.due?`<span class="pill">${esc(fmt(t.due))}</span>`:""}</div><select class="task-action" data-task-action="${esc(t.id)}"><option value="" selected>Task actions…</option><option value="edit">Edit</option><option value="${t.done?"incomplete":"complete"}">${t.done?"Mark Incomplete":"Mark Completed"}</option><option value="delete">Delete</option></select></div>`).join("")}</div>`}
function timelineList(ev){if(!ev.length)return`<div class="empty">No events yet.</div>`;return`<div class="card timeline">${ev.map(e=>`<div class="timeline-item"><strong>${esc(e.title)}</strong><div class="muted">${esc(fmt(e.date))} • ${esc(e.area||"General")}</div>${e.details?`<div class="record-body">${esc(e.details)}</div>`:""}<button class="small-btn" data-event-delete="${esc(e.id)}">Delete</button></div>`).join("")}</div>`}
function dashboard(){const p={high:0,medium:1,low:2};const open=[...data.tasks].filter(t=>!t.done).sort((a,b)=>(p[a.priority]??1)-(p[b.priority]??1));return`<div class="grid cols-4"><div class="card"><h3>Open tasks</h3><div class="big">${open.length}</div><div class="muted">Across ATLAS</div></div><div class="card"><h3>Inbox</h3><div class="big">${data.notes.length}</div><div class="muted">Notes and captures</div></div><div class="card"><h3>Records</h3><div class="big">${data.records.length}</div><div class="muted">Structured records</div></div><div class="card"><h3>Documents</h3><div class="big">${docs.length}</div><div class="muted">Stored on this device</div></div></div><div class="section-title"><h3>Quick access</h3></div><div class="grid cols-4">${NAV.slice(3,13).map(([id,ic,l])=>`<button class="quick-card" data-open="${id}"><span class="quick-icon">${ic}</span><span><strong>${l}</strong><br><small class="muted">Open workspace</small></span></button>`).join("")}</div><div class="section-title"><h3>Priority tasks</h3><button class="small-btn" data-open="actions">View all</button></div>${taskList(open.slice(0,6))}<div class="section-title"><h3>Recent timeline</h3><button class="small-btn" data-open="timeline">Open timeline</button></div>${timelineList([...data.events].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4))}`}
function inbox(){return`<div class="card"><h3>Quick capture</h3><textarea id="noteInput" rows="4" placeholder="Capture something now. Sort it later."></textarea><div style="margin-top:10px"><button class="primary-btn" id="saveNoteBtn">Save to Inbox</button></div></div><div class="section-title"><h3>Inbox items</h3></div><div class="list">${data.notes.length?data.notes.map(n=>`<div class="list-item"><div>📝</div><div><div class="item-title">${esc(n.text)}</div><small class="muted">${new Date(n.created).toLocaleString()}</small></div><button class="small-btn" data-note-delete="${esc(n.id)}">Delete</button></div>`).join(""):`<div class="empty">Your Inbox is empty.</div>`}</div>`}
function actions(){
const e=editingTaskId?data.tasks.find(t=>t.id===editingTaskId):null;
return`<div class="card"><h3>${e?"Edit task":"Add a task"}</h3>${e?`<div class="edit-banner"><strong>Editing:</strong> ${esc(e.title)}</div>`:""}<div class="form-grid">
<input id="newTaskInput" class="wide" placeholder="What needs to be done?" value="${e?esc(e.title):""}">
<div><label class="field-label" for="taskArea">Category</label><select id="taskArea">${areaOpts(e?e.area:"")}</select><div class="field-help">Choose General, an existing category, or add a new one.</div></div>
<div><label class="field-label" for="taskPriority">Priority</label><select id="taskPriority"><option value="high" ${e&&e.priority==="high"?"selected":""}>High priority</option><option value="medium" ${!e||e.priority==="medium"?"selected":""}>Medium priority</option><option value="low" ${e&&e.priority==="low"?"selected":""}>Low priority</option></select></div>
<div><label class="field-label" for="taskDue">Due Date</label><input id="taskDue" type="date" value="${e?esc(e.due||""):""}"></div>
<label class="calendar-option"><input id="taskCalendar" type="checkbox"><span><strong>Add to iPhone Calendar</strong><br><small class="muted">${e?"Create a calendar event for this edited task.":"Creates an all-day event on the due date."}</small></span></label>
<div class="button-row wide"><button class="primary-btn" id="addTaskBtn">${e?"Save changes":"Add task"}</button>${e?`<button class="small-btn" id="cancelTaskEdit">Cancel editing</button>`:""}</div>
</div></div><div class="section-title"><h3>Open tasks</h3></div>${taskList(data.tasks.filter(t=>!t.done))}<div class="section-title"><h3>Completed</h3></div>${taskList(data.tasks.filter(t=>t.done))}`}
}
function library(){const s=[...docs].sort((a,b)=>(b.created||"").localeCompare(a.created||""));return`<div class="upload-zone"><h3>Add documents or photos</h3><p class="muted">Files stay on this device.</p><label class="upload-label">Choose files<input id="docInput" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.rtf" capture="environment"></label></div><div class="section-title"><h3>Document library</h3><span class="pill">${docs.length} items</span></div>${s.length?`<div class="list">${s.map(d=>`<div class="list-item"><div class="doc-preview">${String(d.type||"").startsWith("image/")?`<img src="${URL.createObjectURL(d.blob)}">`:"📄"}</div><div><div class="item-title">${esc(d.name)}</div><small class="muted">${esc(d.area||"General")} • ${new Date(d.created).toLocaleString()}</small><div>${(d.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div></div><div><button class="small-btn" data-doc-open="${esc(d.id)}">Open</button> <button class="danger-btn" data-doc-delete="${esc(d.id)}">Delete</button></div></div>`).join("")}</div>`:`<div class="empty">No documents added yet.</div>`}`}
function timeline(){return`<div class="card"><h3>Add timeline event</h3><div class="form-grid"><input id="eventTitle" placeholder="Event title"><input id="eventDate" type="date"><select id="eventArea">${allCategories().map(a=>`<option>${esc(a)}</option>`).join("")}</select><input id="eventDetails" placeholder="Details"><button class="primary-btn wide" id="addEventBtn">Add event</button></div></div><div class="section-title"><h3>Timeline</h3></div>${timelineList([...data.events].sort((a,b)=>b.date.localeCompare(a.date)))}`}
function people(){return`<div class="card"><h3>Add person</h3><div class="form-grid"><input id="personName" placeholder="Name"><input id="personRelationship" placeholder="Relationship or role"><textarea class="wide" id="personNotes" placeholder="Notes"></textarea><button class="primary-btn wide" id="addPersonBtn">Add person</button></div></div><div class="section-title"><h3>People</h3></div><div class="grid cols-3">${data.people.length?data.people.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><span class="pill">${esc(p.relationship||"")}</span><p class="muted record-body">${esc(p.notes||"")}</p><button class="small-btn" data-person-delete="${esc(p.id)}">Delete</button></div>`).join(""):`<div class="empty">No people added yet.</div>`}</div>`}
function recordsFor(area){return data.records.filter(r=>String(r.area||"").toLowerCase()===area.toLowerCase()).sort((a,b)=>(b.date||b.created||"").localeCompare(a.date||a.created||""))}
function recordCards(rs){if(!rs.length)return`<div class="empty">No records added yet.</div>`;return`<div class="grid cols-2">${rs.map(r=>`<article class="card"><div class="kicker">${esc(r.type||"Record")}</div><h3>${esc(r.title||"Untitled")}</h3><div>${r.date?`<span class="pill">${esc(fmt(r.date))}</span>`:""}${(r.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div><div class="record-body">${esc(r.details||"")}</div><div style="margin-top:12px"><button class="small-btn" data-record-delete="${esc(r.id)}">Delete</button></div></article>`).join("")}</div>`}
function sectionPage(p){const area=p[0].toUpperCase()+p.slice(1),types=data.sections[p]||["General"],rd=docs.filter(d=>String(d.area||"").toLowerCase()===p),re=data.events.filter(e=>String(e.area||"").toLowerCase()===p);return`<div class="card"><h3>Add ${esc(area)} record</h3><div class="form-grid"><input id="recordTitle" class="wide" placeholder="Record title"><select id="recordType">${types.map(t=>`<option>${esc(t)}</option>`).join("")}</select><input id="recordDate" type="date"><input id="recordTags" class="wide" placeholder="Tags, comma separated"><textarea id="recordDetails" class="wide" placeholder="Details, notes, numbers, names, or anything you want to remember"></textarea><button class="primary-btn wide" id="addRecordBtn" data-area="${esc(area)}">Save record</button></div></div><div class="section-title"><h3>${esc(area)} records</h3><span class="pill">${recordsFor(area).length}</span></div>${recordCards(recordsFor(area))}<div class="section-title"><h3>Related tasks</h3></div>${taskList(data.tasks.filter(t=>String(t.area||"").toLowerCase()===p))}<div class="section-title"><h3>Related documents</h3><span class="pill">${rd.length}</span></div>${rd.length?`<div class="list">${rd.map(d=>`<div class="list-item"><div>📄</div><div>${esc(d.name)}</div><button class="small-btn" data-doc-open="${esc(d.id)}">Open</button></div>`).join("")}</div>`:`<div class="empty">No related documents yet.</div>`}<div class="section-title"><h3>Related timeline events</h3></div>${timelineList([...re].sort((a,b)=>b.date.localeCompare(a.date)))}`}
function settings(){return`<div class="grid cols-2"><div class="card"><h3>Version</h3><div class="big">0.3.3</div><p class="muted">Single-file iPhone-friendly build.</p></div><div class="card"><h3>Storage</h3><p class="muted">Tasks, notes, records, events and people are stored on this device. Uploaded files use IndexedDB.</p></div><div class="card"><h3>Backup</h3><p class="muted">Use Export backup in the menu to save your ATLAS metadata as a JSON file.</p></div><div class="card"><h3>Privacy</h3><p class="badge-ok">This build does not send ATLAS content to a server.</p></div><div class="card"><h3>Reset</h3><p class="muted">This resets metadata only; uploaded documents stay on the device.</p><button class="danger-btn" id="clearDataBtn">Reset metadata</button></div></div>`}
function searchResults(q){q=q.toLowerCase().trim();if(!q)return dashboard();const th=data.tasks.filter(t=>(`${t.title} ${t.area} ${t.priority}`).toLowerCase().includes(q)),nh=data.notes.filter(n=>String(n.text||"").toLowerCase().includes(q)),rh=data.records.filter(r=>(`${r.title} ${r.area} ${r.type} ${r.details} ${(r.tags||[]).join(" ")}`).toLowerCase().includes(q)),dh=docs.filter(d=>(`${d.name} ${d.area} ${(d.tags||[]).join(" ")}`).toLowerCase().includes(q)),eh=data.events.filter(e=>(`${e.title} ${e.area} ${e.details}`).toLowerCase().includes(q)),ph=data.people.filter(p=>(`${p.name} ${p.relationship} ${p.notes}`).toLowerCase().includes(q));return`<div class="section-title"><h3>Search results for “${esc(q)}”</h3></div><div class="grid cols-3"><div class="card"><h3>Tasks</h3>${th.length?th.map(t=>`<p>${esc(t.title)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Records</h3>${rh.length?rh.map(r=>`<p>${esc(r.title)} <span class="pill">${esc(r.area)}</span></p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Documents</h3>${dh.length?dh.map(d=>`<p>${esc(d.name)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Timeline</h3>${eh.length?eh.map(e=>`<p>${esc(fmt(e.date))} — ${esc(e.title)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Inbox</h3>${nh.length?nh.map(n=>`<p>${esc(n.text)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>People</h3>${ph.length?ph.map(p=>`<p>${esc(p.name)} — ${esc(p.relationship)}</p>`).join(""):`<p class="muted">No matches</p>`}</div></div>`}
function render(){const tm={home:"Command Center",inbox:"Inbox",actions:"Action Center",library:"Document Library",timeline:"Timeline",people:"People",settings:"Settings"};pageTitle.textContent=tm[currentPage]||currentPage[0].toUpperCase()+currentPage.slice(1);content.innerHTML=currentPage==="home"?dashboard():currentPage==="inbox"?inbox():currentPage==="actions"?actions():currentPage==="library"?library():currentPage==="timeline"?timeline():currentPage==="people"?people():currentPage==="settings"?settings():sectionPage(currentPage);bind()}

function wireTaskCategory(){
  const s=$("#taskArea");
  if(!s)return;
  s.onchange=()=>{
    if(s.value!=="__new__")return;
    const name=(prompt("Name your new category:","")||"").trim();
    if(!name){s.value="";return}
    if(!allCategories().some(x=>x.toLowerCase()===name.toLowerCase())){
      customCategories.push(name);
      localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
    }
    s.innerHTML=areaOpts(name);
    s.value=name;
  };
}
function icsDate(d){return d.replaceAll("-","")}
function icsNextDate(d){
  const [y,m,day]=d.split("-").map(Number),x=new Date(y,m-1,day+1);
  return `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`;
}
function icsEsc(s=""){return String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
function addToIPhoneCalendar(task){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ATLAS//Task//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${task.id}@atlas`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${icsDate(task.due)}`,`DTEND;VALUE=DATE:${icsNextDate(task.due)}`,
    `SUMMARY:${icsEsc(task.title)}`,`DESCRIPTION:${icsEsc(`ATLAS task\nCategory: ${task.area}\nPriority: ${task.priority}`)}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`ATLAS-${task.title.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").slice(0,40)||"task"}.ics`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast("Calendar event created — open the .ics file and tap Add.");
}
function bind(){
wireTaskCategory();
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go(b.dataset.open));
document.querySelectorAll("[data-task-action]").forEach(s=>s.onchange=()=>{const id=s.dataset.taskAction,action=s.value,t=data.tasks.find(x=>x.id===id);if(!t)return;if(action==="edit"){editingTaskId=id;go("actions");setTimeout(()=>$("#newTaskInput")?.focus(),50);return}if(action==="complete"){t.done=true;save();render();toast("Task marked completed");return}if(action==="incomplete"){t.done=false;save();render();toast("Task moved to open tasks");return}if(action==="delete"){if(confirm(`Delete "${t.title}"?`)){data.tasks=data.tasks.filter(x=>x.id!==id);if(editingTaskId===id)editingTaskId=null;save();render();toast("Task deleted")}else{s.value=""}}});
document.querySelectorAll("[data-note-delete]").forEach(b=>b.onclick=()=>{data.notes=data.notes.filter(x=>x.id!==b.dataset.noteDelete);save();render()});
document.querySelectorAll("[data-event-delete]").forEach(b=>b.onclick=()=>{data.events=data.events.filter(x=>x.id!==b.dataset.eventDelete);save();render()});
document.querySelectorAll("[data-person-delete]").forEach(b=>b.onclick=()=>{data.people=data.people.filter(x=>x.id!==b.dataset.personDelete);save();render()});
document.querySelectorAll("[data-record-delete]").forEach(b=>b.onclick=()=>{data.records=data.records.filter(x=>x.id!==b.dataset.recordDelete);save();render()});
document.querySelectorAll("[data-doc-delete]").forEach(b=>b.onclick=()=>deleteDoc(b.dataset.docDelete));
document.querySelectorAll("[data-doc-open]").forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.docOpen);if(d){const u=URL.createObjectURL(d.blob);window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000)}});
if($("#addTaskBtn"))$("#addTaskBtn").onclick=()=>{const v=$("#newTaskInput").value.trim();if(v){const addCal=$("#taskCalendar").checked,due=$("#taskDue").value;if(addCal&&!due){alert("Choose a Due Date before adding this task to your calendar.");return}const category=($("#taskArea").value&&$("#taskArea").value!=="__new__")?$("#taskArea").value:"General";if(editingTaskId){const task=data.tasks.find(x=>x.id===editingTaskId);if(task){task.title=v;task.area=category;task.due=due;task.priority=$("#taskPriority").value;save();if(addCal)addToIPhoneCalendar(task);editingTaskId=null;render();toast("Task updated")}return}const task={id:uid("task"),title:v,done:false,area:category,due,priority:$("#taskPriority").value};data.tasks.unshift(task);save();if(addCal)addToIPhoneCalendar(task);render();toast("Task added")}};
if($("#cancelTaskEdit"))$("#cancelTaskEdit").onclick=()=>{editingTaskId=null;render();toast("Editing cancelled")};
if($("#saveNoteBtn"))$("#saveNoteBtn").onclick=()=>{const v=$("#noteInput").value.trim();if(v){data.notes.unshift({id:uid("note"),text:v,created:new Date().toISOString()});save();render();toast("Saved to Inbox")}};
if($("#addEventBtn"))$("#addEventBtn").onclick=()=>{const title=$("#eventTitle").value.trim(),date=$("#eventDate").value;if(title&&date){data.events.push({id:uid("event"),title,date,area:$("#eventArea").value,details:$("#eventDetails").value.trim()});save();render();toast("Event added")}};
if($("#addPersonBtn"))$("#addPersonBtn").onclick=()=>{const name=$("#personName").value.trim();if(name){data.people.push({id:uid("person"),name,relationship:$("#personRelationship").value.trim(),notes:$("#personNotes").value.trim()});save();render();toast("Person added")}};
if($("#addRecordBtn"))$("#addRecordBtn").onclick=()=>{const title=$("#recordTitle").value.trim();if(title){data.records.unshift({id:uid("record"),title,area:$("#addRecordBtn").dataset.area,type:$("#recordType").value,date:$("#recordDate").value,tags:$("#recordTags").value.split(",").map(x=>x.trim()).filter(Boolean),details:$("#recordDetails").value.trim(),created:new Date().toISOString()});save();render();toast("Record saved")}};
if($("#docInput"))$("#docInput").onchange=async e=>{for(const f of e.target.files){const tags=(prompt(`Tags for ${f.name} (comma separated):`,"")||"").split(",").map(x=>x.trim()).filter(Boolean),area=prompt(`ATLAS area for ${f.name}:`,"General")||"General";await putDoc({id:uid("doc"),name:f.name,type:f.type||"application/octet-stream",size:f.size,created:new Date().toISOString(),tags,area,blob:f})}await loadDocs();toast("Files added")};
if($("#clearDataBtn"))$("#clearDataBtn").onclick=()=>{if(confirm("Reset ATLAS metadata? Uploaded files will remain.")){data=clone(defaults);save();go("home")}}
}
function runCommand(raw){const text=raw.trim();if(!text)return;const cleaned=text.replace(/^atlas[,\s]*/i,"").trim(),lower=cleaned.toLowerCase();const nav=NAV.find(([id,,l])=>lower.includes(`open ${id}`)||lower.includes(`show ${id}`)||lower===id||lower.includes(l.toLowerCase()));if(nav&&/open|show|go to|take me|^medical$|^legal$|^housing$|^finance$|^vehicles$|^pets$|^people$|^knowledge$|^library$|^timeline$/.test(lower)){go(nav[0]);toast(`Opening ${nav[2]}`);return}const at=cleaned.match(/(?:add|create|make)(?: a)? task(?: to)? (.+)/i)||cleaned.match(/remind me to (.+)/i);if(at){data.tasks.unshift({id:uid("task"),title:at[1].trim(),done:false,area:"General",due:"",priority:"medium"});save();go("actions");toast("Task added");return}const an=cleaned.match(/(?:add|save|record)(?: a)? note(?: that)? (.+)/i);if(an){data.notes.unshift({id:uid("note"),text:an[1].trim(),created:new Date().toISOString()});save();go("inbox");toast("Note saved");return}$("#globalSearch").value=cleaned;pageTitle.textContent="Search";content.innerHTML=searchResults(cleaned);bind();toast("Search complete")}
let recognition=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang="en-US";recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{micBtn.classList.add("listening");voiceStatus.textContent="Listening…"};recognition.onresult=e=>{let text="";for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;commandInput.value=text;voiceStatus.textContent=e.results[e.results.length-1].isFinal?"Ready to run.":"Listening…"};recognition.onerror=e=>{voiceStatus.textContent=`Voice error: ${e.error}`;micBtn.classList.remove("listening")};recognition.onend=()=>{micBtn.classList.remove("listening");if(commandInput.value.trim())voiceStatus.textContent="Ready to run."}}else{voiceStatus.textContent="Voice recognition is not supported here. Type your command instead.";micBtn.disabled=true}
micBtn.onclick=()=>{if(recognition){commandInput.value="";recognition.start()}};
$("#runCommandBtn").onclick=()=>runCommand(commandInput.value);
$("#globalSearch").addEventListener("input",e=>{pageTitle.textContent=e.target.value?"Search":"Command Center";content.innerHTML=searchResults(e.target.value);bind()});
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
$("#themeBtn").onclick=()=>{document.documentElement.classList.toggle("light");localStorage.setItem("atlasTheme",document.documentElement.classList.contains("light")?"light":"dark")};
if(localStorage.getItem("atlasTheme")==="light")document.documentElement.classList.add("light");
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ATLAS-0.3-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("#importInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{data=normalize(JSON.parse(await f.text()));save();go("home");toast("Backup imported")}catch{alert("That file is not valid ATLAS JSON.")}};
greet();renderNav();render();loadDocs();
</script>
</body>
</html>
