.ghost-btn,.file-label{border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:center}.main{margin-left:286px;min-height:100vh;padding:20px 26px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:env(safe-area-inset-top);background:rgba(7,17,28,.88);backdrop-filter:blur(18px);padding:10px 0 18px;z-index:10}.light .topbar{background:rgba(238,242,247,.88)}.topbar h2{margin:3px 0 0;font-size:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold)}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:12px}.hero{display:grid;gap:12px;margin-bottom:22px}.search-wrap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 16px;box-shadow:var(--shadow)}.search-wrap input{width:100%;padding:15px 0;border:0;outline:0;background:transparent;color:var(--text)}.voice-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid rgba(214,182,107,.25);padding:14px;border-radius:18px}.mic-btn{width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 0 rgba(214,182,107,.35);font-size:24px}.mic-btn.listening{animation:pulse 1.15s infinite}@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(214,182,107,0)}100%{box-shadow:0 0 0 0 rgba(214,182,107,0)}}.voice-title{font-weight:800}.voice-status{color:var(--muted);font-size:13px;margin-top:4px}.primary-btn{border:0;border-radius:12px;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px}.danger-btn{border:1px solid rgba(228,109,109,.35);background:transparent;color:var(--danger);border-radius:10px;padding:8px 10px}textarea{resize:vertical;min-height:60px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;outline:0}
.grid{display:grid;gap:14px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 10px;font-size:16px}.card .big{font-size:30px;font-weight:900;color:var(--gold2)}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.section-title h3{margin:0}.quick-card{display:flex;gap:13px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:16px}.quick-icon{font-size:26px}.list{display:grid;gap:9px}.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}.list-item.done .item-title{text-decoration:line-through;opacity:.6}.item-title{font-weight:700}.check{width:20px;height:20px}.small-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .wide{grid-column:1/-1}.form-grid input,.form-grid select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);margin:2px}.pill.high{color:#ff9b9b}.pill.medium{color:#ffd18b}.pill.low{color:#8fd7ab}.mobile-nav{display:none}.mobile-only{display:none}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#111d2b;color:#fff;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.doc-preview{width:54px;height:54px;border-radius:10px;background:var(--panel);display:grid;place-items:center;overflow:hidden}.doc-preview img{width:100%;height:100%;object-fit:cover}.timeline{position:relative;padding-left:24px}.timeline:before{content:"";position:absolute;left:11px;top:18px;bottom:18px;width:2px;background:var(--line)}.timeline-item{position:relative;margin-bottom:18px}.timeline-item:before{content:"";position:absolute;left:-18px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--gold)}.badge-ok{color:var(--ok)}.upload-zone{border:1px dashed rgba(214,182,107,.45);border-radius:16px;padding:18px;text-align:center;background:rgba(214,182,107,.05)}.upload-zone input{display:none}.upload-label{display:inline-block;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px;border-radius:12px}.record-body{white-space:pre-wrap;line-height:1.5}.kicker{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
.field-label{display:block;font-size:12px;font-weight:800;color:var(--gold);margin:2px 0 6px}.field-help{font-size:12px;color:var(--muted);margin-top:6px}.calendar-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text)}.calendar-option input{width:20px;height:20px}

.task-check{width:30px;height:30px;border:2px solid rgba(238,244,251,.72);border-radius:8px;background:rgba(255,255,255,.04);color:#102033;padding:0;display:grid;place-items:center;flex:0 0 30px;transition:background .18s ease,border-color .18s ease,transform .18s ease;appearance:none;-webkit-appearance:none}

.task-check.checked{background:var(--gold2);border-color:var(--gold2)}
.task-check.checked::after{opacity:1;transform:scale(1) rotate(0)}
.task-check.animating{animation:taskCheckPop .42s ease}

@keyframes taskCheckPop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes taskFinish{0%{opacity:1;transform:translateX(0)}72%{opacity:.78;transform:translateX(4px)}100%{opacity:0;transform:translateX(16px)}}
.task-action{min-width:150px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px}.edit-banner{border:1px solid rgba(214,182,107,.35);background:rgba(214,182,107,.08);padding:12px 14px;border-radius:12px;margin-bottom:12px}.button-row{display:flex;gap:8px;flex-wrap:wrap}

.voice-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.voice-live-title{font-size:20px;font-weight:900}.voice-live-copy{font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px}
.voice-status-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--cyan2)}.voice-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.voice-dot.live{background:var(--ok);box-shadow:0 0 12px var(--ok)}.voice-dot.busy{background:var(--gold2);box-shadow:0 0 12px var(--gold2)}
.voice-controls{position:relative;display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-top:16px}.voice-controls select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}
.voice-btn-live{border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan2),var(--gold2));color:#07111c;font-weight:900;padding:11px 16px}.voice-btn-end{background:rgba(228,109,109,.16);color:#ff9b9b;border:1px solid rgba(228,109,109,.4)}
.voice-note{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.4}
@media(max-width:1050px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}.mobile-only{display:inline-grid;place-items:center}.topbar h2{font-size:23px}.grid.cols-4,.grid.cols-3,.grid.cols-2,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(13,27,42,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}.mobile-nav .nav-item{display:grid;place-items:center;gap:2px;padding:5px 2px;font-size:10px}.mobile-nav .nav-icon{font-size:18px}.brain-launch-inner,.brain-head-grid{grid-template-columns:auto 1fr}.voice-grid{grid-template-columns:1fr;text-align:center}.voice-orb{margin:0 auto}.voice-controls{grid-template-columns:1fr 1fr}.voice-controls select{grid-column:1/-1}.brain-launch-inner .primary-btn,.brain-head-grid .brain-status{grid-column:1/-1}.atlas-composer-wrap{bottom:calc(72px + env(safe-area-inset-bottom))}.atlas-composer{gap:4px;padding:7px 8px}.composer-icon-btn,.composer-send{width:38px;height:38px;flex-basis:38px}.atlas-orb{width:72px;height:72px}.voice-card{grid-template-columns:auto 1fr}.voice-card .primary-btn{grid-column:1/-1}.list-item{grid-template-columns:auto 1fr}.list-item> :last-child{grid-column:2}}
</style>

<style>
.vault-toolbar,.vault-path,.vault-menu{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.vault-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 7px;margin-top:16px}
.vault-tile{position:relative;text-align:center;padding:9px 2px;border:1px solid transparent;border-radius:12px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.vault-tile.chosen{border-color:var(--gold);background:rgba(214,182,107,.18)}
.vault-main{border:0;background:transparent;color:inherit;display:flex;flex-direction:column;align-items:center;width:100%;gap:7px;padding:0}
.vault-icon{font-size:36px;height:57px;width:57px;display:grid;place-items:center;overflow:hidden}
.vault-icon img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.vault-name{font-size:12px;line-height:1.3;overflow-wrap:anywhere;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vault-more{position:absolute;right:0;top:0;border:1px solid var(--line);border-radius:50%;width:28px;height:28px;background:var(--panel2);color:var(--text)}
.vault-mark{position:absolute;right:3px;top:3px;background:var(--panel);border-radius:50%;font-size:20px}
.vault-menu{display:flex;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:0;padding:6px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.vault-menu .small-btn{display:block;width:100%;min-height:46px;text-align:left;padding:12px 16px;border:0;border-radius:8px;background:transparent;color:var(--text);font-weight:500}
.vault-menu .small-btn + .small-btn{border-top:1px solid var(--line);border-radius:0}
.vault-menu .small-btn[data-vault-action="delete"]{color:var(--danger);border-top:1px solid var(--line)}
.vault-menu #vaultCloseMenu{text-align:center;color:var(--muted);font-weight:400}
.vault-bulk{position:sticky;bottom:85px;z-index:9;padding:12px;background:var(--panel);border:1px solid var(--gold);border-radius:14px;display:flex;gap:8px;flex-wrap:wrap}
.vault-preview{max-width:100%;max-height:55vh;object-fit:contain}
@media(min-width:700px){.vault-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">A</div><div><h1>ATLAS</h1><p>Advanced Tracking, Library & Archival System</p><span class="version">0.7.4.3 • Folder Import</span></div></div>
  <nav id="desktopNav" class="nav-list"></nav>
  <div class="sidebar-footer">
    <button class="ghost-btn" id="exportBtn">Export backup</button>
    <label class="ghost-btn file-label">Import backup<input id="importInput" type="file" accept="application/json" hidden></label>
  </div>
</aside>
<main class="main">
  <header class="topbar"><button class="icon-btn mobile-only" id="menuBtn">☰</button><div><div class="eyebrow" id="greeting"></div><h2 id="pageTitle">Command Center</h2></div><button class="icon-btn" id="themeBtn">◐</button></header>
  <section class="hero">
    <div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Search tasks, notes, records, documents, people and events…" autocomplete="off"></div>
  </section>
  <section id="content"></section>
</main>

function uid(p="id"){return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function atlasNow(){return new Date().toISOString()}
function atlasSyncOpId(){return "op-"+Date.now()+"-"+Math.random().toString(36).slice(2,10)}
function atlasMessageKey(m){
  if(m&&m._syncId)return String(m._syncId);
  const s=[m?.role||"",m?.at||"",m?.source||"",m?.content||""].join("|");
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return "msg-"+(h>>>0).toString(36)+"-"+String(m?.at||"").replace(/\D/g,"").slice(-8);
}
function ensureAtlasMessageIds(list){
  return (Array.isArray(list)?list:[]).map(m=>({...m,_syncId:atlasMessageKey(m)}));
}

function saveAtlasSyncOps(){localStorage.setItem("atlasSyncOps",JSON.stringify(atlasSyncOps.slice(-1000)))}
function queueAtlasSyncOp(op){
  if(atlasSyncApplying||!op)return;
  atlasSyncOps.push({id:atlasSyncOpId(),at:atlasNow(),...op});
  saveAtlasSyncOps();
  scheduleAtlasSync();
}
function atlasCollections(x){return{tasks:x.tasks||[],notes:x.notes||[],events:x.events||[],people:x.people||[],records:x.records||[]}}
function queueAtlasDataDiff(before,after){
  if(atlasSyncApplying)return;
  const a=atlasCollections(before||{}),b=atlasCollections(after||{});
  for(const collection of Object.keys(b)){
    const oldMap=new Map((a[collection]||[]).map(x=>[String(x.id),x]));
    const newMap=new Map((b[collection]||[]).map(x=>[String(x.id),x]));
    for(const [id,item] of newMap){
      const prev=oldMap.get(id);
      if(!prev||JSON.stringify(prev)!==JSON.stringify(item))queueAtlasSyncOp({type:"upsert",collection,item:clone(item)});
    }
    for(const [id] of oldMap)if(!newMap.has(id))queueAtlasSyncOp({type:"delete",collection,id});
  }
}

function scheduleAtlasSync(delay=550){

}
function applyAtlasOpLocal(op){
  if(!op)return;
  if(op.type==="upsert"&&["tasks","notes","events","people","records"].includes(op.collection)&&op.item?.id){
    const list=data[op.collection]||[];
    const i=list.findIndex(x=>String(x.id)===String(op.item.id));
    if(i>=0)list[i]=clone(op.item);else list.unshift(clone(op.item));
    return;
  }
  if(op.type==="delete"&&["tasks","notes","events","people","records"].includes(op.collection)){
    data[op.collection]=(data[op.collection]||[]).filter(x=>String(x.id)!==String(op.id));return;
  }
  if(op.type==="chat_upsert"&&op.message){
    const msg={...clone(op.message),_syncId:atlasMessageKey(op.message)};
    const i=atlasChat.findIndex(x=>atlasMessageKey(x)===msg._syncId);
    if(i>=0)atlasChat[i]=msg;else atlasChat.push(msg);return;
  }
  if(op.type==="chat_clear"){atlasChat=[];return}
  if(op.type==="category_add"&&op.name&&!customCategories.some(x=>x.toLowerCase()===String(op.name).toLowerCase()))customCategories.push(String(op.name));
}
function applyAtlasServerState(state,pendingOps=[]){
  atlasSyncApplying=true;
  try{
    if(state?.data)data=normalize(state.data);
    atlasChat=ensureAtlasMessageIds(state?.chat||[]).slice(-100);
    customCategories=Array.isArray(state?.customCategories)?state.customCategories.map(String):[];
    for(const op of pendingOps)applyAtlasOpLocal(op);
    localStorage.setItem("atlasDataV3",JSON.stringify(data));
    localStorage.setItem("atlasChatV1",JSON.stringify(atlasChat.slice(-100)));
    localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
    atlasLastSavedData=clone(data);
    atlasLastSavedChat=clone(atlasChat);
  }finally{atlasSyncApplying=false}
}
async function atlasSyncNow({silent=false}={}){
  const password=brainPassword();
  if(!password||atlasSync.inFlight)return false;
  atlasSync.inFlight=true;atlasSync.status="syncing";updateAtlasSyncBadge();
  const sentOps=atlasSyncOps.map(clone);
  const seed=!atlasSync.initialized?{data:clone(data),chat:ensureAtlasMessageIds(atlasChat),customCategories:[...customCategories]}:null;
  try{
    const res=await fetch(ATLAS_SYNC_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Atlas-Password":password},
      body:JSON.stringify({device_id:atlasSync.deviceId,client_revision:atlasSync.revision,seed,ops:sentOps})
    });
    const body=await res.json().catch(()=>({}));
    if(res.status===401){localStorage.removeItem("atlasBrainPassword");throw new Error("ATLAS sync password rejected.")}
    if(!res.ok)throw new Error(body.detail||body.error||("Sync failed ("+res.status+")."));
    const sentIds=new Set(sentOps.map(x=>x.id));
    atlasSyncOps=atlasSyncOps.filter(x=>!sentIds.has(x.id));
    saveAtlasSyncOps();
    applyAtlasServerState(body.state,atlasSyncOps);
    atlasSync.revision=Number(body.revision||0)||0;
    atlasSync.initialized=true;
    atlasSync.lastSync=body.updated_at||atlasNow();
    atlasSync.status="ok";
    localStorage.setItem("atlasSyncRevision",String(atlasSync.revision));
    localStorage.setItem("atlasSyncInitialized","1");
    localStorage.setItem("atlasSyncLastAt",atlasSync.lastSync);
    if(currentPage==="atlas"||currentPage==="home"||currentPage==="actions"||currentPage==="inbox"||currentPage==="timeline"||currentPage==="people")render();
    if(atlasSyncOps.length)scheduleAtlasSync(250);
    return true;
  }catch(err){
    console.error("ATLAS sync error",err);
    atlasSync.status="error";updateAtlasSyncBadge();
    if(!silent)toast("ATLAS sync will retry");
    return false;
  }finally{atlasSync.inFlight=false;updateAtlasSyncBadge()}
}

const atlasVaultFoldersKey="atlasVaultFolders071";
let atlasVaultFolders=(()=>{try{const x=JSON.parse(localStorage.getItem(atlasVaultFoldersKey)||"[]");return Array.isArray(x)?x:[]}catch{return[]}})();
let atlasVaultFolderFilter="all",atlasVaultSearch="",atlasVaultSort="newest";
function atlasSaveVaultFolders(){localStorage.setItem(atlasVaultFoldersKey,JSON.stringify(atlasVaultFolders))}
function atlasVaultFolderName(id){return atlasVaultFolders.find(f=>f.id===id)?.name||"Unfiled"}
function atlasVaultFolderOptions(selected=""){return `<option value="">Unfiled</option>`+atlasVaultFolders.map(f=>`<option value="${esc(f.id)}" ${f.id===selected?"selected":""}>${esc(f.name)}</option>`).join("")}
function atlasVaultFolderPath(id,seen=new Set()){
  const f=atlasVaultFolders.find(x=>x.id===id);
  if(!f||seen.has(id))return "Unfiled";
  seen.add(id);
  return f.parentId?atlasVaultFolderPath(f.parentId,seen)+" / "+f.name:f.name;
}
function atlasVaultFolderDescendants(id){
  const found=new Set([id]);let previous=-1;
  while(previous!==found.size){previous=found.size;atlasVaultFolders.forEach(f=>{if(found.has(f.parentId))found.add(f.id)})}
  return found;
}

  await loadDocs();toast("File details saved");
}
async function atlasVaultMoveDoc(id,folderId){

}
function atlasVaultNewFolder(){
  const name=prompt("New folder name");if(name===null)return;
  if(!name.trim())return alert("Folder name is required.");
  const parentId=atlasVaultFolderFilter!=="all"&&atlasVaultFolderFilter!=="unfiled"?atlasVaultFolderFilter:"";
  if(atlasVaultFolders.some(f=>f.parentId===parentId&&f.name.toLowerCase()===name.trim().toLowerCase()))return alert("A folder with that name already exists here.");
  atlasVaultFolders.push({id:uid("folder"),name:name.trim(),parentId});
  atlasSaveVaultFolders();render();toast("Folder created");
}
function atlasVaultRenameFolder(id){

function atlasVaultDeleteFolder(id){
  const f=atlasVaultFolders.find(x=>x.id===id);if(!f)return;
  if(!confirm(`Remove folder "${f.name}"? Files will be moved to Unfiled, not deleted.`))return;
  const descendants=atlasVaultFolderDescendants(id);
  Promise.all(docs.filter(d=>descendants.has(d.folderId)).map(d=>putDoc({...d,folderId:""}))).then(()=>{
    atlasVaultFolders=atlasVaultFolders.filter(f=>!descendants.has(f.id));
    atlasSaveVaultFolders();atlasVaultFolderFilter="all";loadDocs();toast("Folder removed; files preserved");
  }).catch(e=>alert("Folder removal failed: "+e.message));
}

function vaultVisible(){
 const q=atlasVaultSearch.toLowerCase().trim(),p=atlasVaultFolderFilter;
 const folders=atlasVaultFolders.filter(f=>(p==="all"?!f.parentId:p==="unfiled"?false:f.parentId===p)&&(!q||f.name.toLowerCase().includes(q)));
 const files=docs.filter(d=>(p==="all"?!d.folderId:p==="unfiled"?!d.folderId:d.folderId===p)&&(!q||[d.name,d.area,(d.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));

async function vaultBatch(action,items=vaultSelectedItems(),opts={}){

 for(const item of items){

const atlasDocAnalysis=new Map();
async function atlasExtractDocument(doc){
 const blob=doc.blob;
 if(!blob)throw Error("Document bytes are unavailable.");
 const name=doc.name.toLowerCase(),type=doc.type||"";
 if(name.endsWith(".pdf")||type==="application/pdf"){
  if(blob.size>8*1024*1024)throw Error("PDF analysis supports up to 8 MB.");
  const bytes=new Uint8Array(await blob.arrayBuffer());
  let binary="";for(let i=0;i<bytes.length;i+=16384)binary+=String.fromCharCode(...bytes.subarray(i,i+16384));
  return {kind:"pdf",base64:btoa(binary)};
 }
 if(name.endsWith(".docx")){
  if(blob.size>8*1024*1024)throw Error("DOCX analysis supports up to 8 MB.");
  if(!window.JSZip)throw Error("ZIP engine unavailable.");
  const zip=await JSZip.loadAsync(blob);
  const xml=await zip.file("word/document.xml")?.async("string");
  if(!xml)throw Error("This DOCX has no readable document text.");
  const dom=new DOMParser().parseFromString(xml,"application/xml");
  const paragraphs=[...dom.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","p")];
  const text=paragraphs.map(p=>[...p.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main","t")].map(t=>t.textContent).join("")).join("\n");
  return {kind:"text",text:text.slice(0,35000)};
 }
 if(/\.(txt|md|csv|json|xml|html|htm|rtf|log)$/i.test(name)||type.startsWith("text/")){
  return {kind:"text",text:(await blob.slice(0,120000).text()).slice(0,35000)};
 }
 throw Error("Content analysis currently supports PDF, DOCX, TXT, MD, CSV, JSON, HTML, XML, RTF, and LOG. Scanned images require OCR in a later release.");
}

function safeAtlasArgs(args){

// Action history is device-local. Data changes themselves use the existing cloud sync.
const atlasActionHistoryKey="atlasActionHistoryV065";
let atlasActionHistory=(()=>{try{const x=JSON.parse(localStorage.getItem(atlasActionHistoryKey)||"[]");return Array.isArray(x)?x:[]}catch{return[]}})();
function atlasLogAction(name,collection,before,after){
  const entry={id:uid("action"),at:new Date().toISOString(),name,collection,before:before?clone(before):null,after:after?clone(after):null,undone:false};
  atlasActionHistory.unshift(entry);atlasActionHistory=atlasActionHistory.slice(0,60);
  localStorage.setItem(atlasActionHistoryKey,JSON.stringify(atlasActionHistory));
}
function atlasUndoAction(id){
  const e=atlasActionHistory.find(x=>x.id===id);
  if(!e||e.undone)return {ok:false,error:"Action is not available to undo."};
  const list=data[e.collection];if(!Array.isArray(list))return {ok:false,error:"Cannot undo this action."};
  const target=e.after||e.before,index=list.findIndex(x=>x.id===target?.id);
  if(e.after&&(index<0||JSON.stringify(list[index])!==JSON.stringify(e.after)))return {ok:false,error:"Item changed since this action; undo cancelled."};
  if(!e.after&&index>=0)return {ok:false,error:"Item already exists; undo cancelled."};
  if(e.before){if(index>=0)list[index]=clone(e.before);else list.unshift(clone(e.before));}
  else if(index>=0)list.splice(index,1);
  e.undone=true;localStorage.setItem(atlasActionHistoryKey,JSON.stringify(atlasActionHistory));
  save();render();toast("Action undone");
  return {ok:true,action:"undone",undid:e.name,collection:e.collection,item_id:target?.id};
}

async function executeAtlasToolImpl(name,args){
  args=safeAtlasArgs(args);
  const clean=v=>String(v??"").trim();
  const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(clean(v))?clean(v):"";
  const priority=v=>["high","medium","low"].includes(clean(v).toLowerCase())?clean(v).toLowerCase():"medium";
  const category=v=>{
    const wanted=clean(v)||"General";
    const existing=allCategories().find(x=>x.toLowerCase()===wanted.toLowerCase());
    if(existing)return existing;
    customCategories.push(wanted);
    localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
    return wanted;
  };


  if(name==="list_vault_imports")return {ok:true,imports:[...atlasImportHistory].reverse().slice(0,25).map(t=>({id:t.id,kind:t.kind,label:t.label,imported_at:t.at,files:t.files.length,folders:t.folders.length,status:t.status}))};
  if(name==="undo_last_vault_import")return await atlasUndoImport(args.import_id||null);
  if(name==="extract_vault_zip")return await atlasExtractZip(args.file_id);
  if(name==="list_vault_folders")return {ok:true,folders:atlasVaultFolders.map(f=>({id:f.id,name:f.name,parent_id:f.parentId||"",path:atlasVaultFolderPath(f.id)}))};
  if(name==="create_vault_folder"){
    const n=clean(args.name),p=clean(args.parent_id);
    if(!n)return {ok:false,error:"Folder name required"};
    if(p&&!atlasVaultFolders.some(f=>f.id===p))return {ok:false,error:"Parent folder not found. List folders first."};
    if(atlasVaultFolders.some(f=>f.parentId===p&&f.name.toLowerCase()===n.toLowerCase()))return {ok:false,error:"Folder already exists"};
    const f={id:uid("folder"),name:n,parentId:p};atlasVaultFolders.push(f);atlasSaveVaultFolders();render();
    return {ok:true,folder:{id:f.id,name:f.name,path:atlasVaultFolderPath(f.id)}};
  }
  if(name==="rename_vault_folder"||name==="move_vault_folder"){
    const f=atlasVaultFolders.find(x=>x.id===clean(args.folder_id));
    if(!f)return {ok:false,error:"Folder not found"};
    if(name==="rename_vault_folder"){
      const n=clean(args.name);if(!n)return {ok:false,error:"Name required"};
      if(atlasVaultFolders.some(x=>x.id!==f.id&&x.parentId===f.parentId&&x.name.toLowerCase()===n.toLowerCase()))return {ok:false,error:"Duplicate folder name"};
      f.name=n;
    }else{
      const p=clean(args.parent_id);
      if(p&&!atlasVaultFolders.some(x=>x.id===p))return {ok:false,error:"Parent not found"};
      if(p&&atlasVaultFolderDescendants(f.id).has(p))return {ok:false,error:"Cannot move folder inside itself or descendant"};
      if(atlasVaultFolders.some(x=>x.id!==f.id&&x.parentId===p&&x.name.toLowerCase()===f.name.toLowerCase()))return {ok:false,error:"Duplicate folder name"};
      f.parentId=p;
    }
    atlasSaveVaultFolders();render();return {ok:true,folder:{id:f.id,name:f.name,path:atlasVaultFolderPath(f.id)}};
  }
  if(name==="search_vault_files"){
    const q=clean(args.query).toLowerCase();
    const found=docs.filter(d=>!q||[d.name,d.area,atlasVaultFolderPath(d.folderId),(d.tags||[]).join(" ")].join(" ").toLowerCase().includes(q));
    return {ok:true,total:found.length,files:found.slice(0,40).map(d=>({id:d.id,name:d.name,category:d.area,folder_id:d.folderId||"",folder_path:atlasVaultFolderPath(d.folderId),tags:d.tags||[],type:d.type}))};
  }
  if(name==="organize_vault_file"){
    const d=docs.find(x=>x.id===clean(args.file_id));if(!d)return {ok:false,error:"File not found. Search first."};
    const next={...d};
    if(args.folder_id!==undefined){const f=clean(args.folder_id);if(f&&!atlasVaultFolders.some(x=>x.id===f))return {ok:false,error:"Folder not found"};next.folderId=f}
    if(args.name!==undefined){if(!clean(args.name))return {ok:false,error:"File name required"};next.name=clean(args.name)}
    if(args.category!==undefined)next.area=clean(args.category)||"General";
    if(args.tags!==undefined){if(!Array.isArray(args.tags))return {ok:false,error:"Tags must be a list"};next.tags=args.tags.map(clean).filter(Boolean)}
    if(JSON.stringify([d.folderId||"",d.name,d.area,d.tags||[]])===JSON.stringify([next.folderId||"",next.name,next.area,next.tags||[]]))return {ok:false,error:"No changes"};
    try{await putDoc(next);await loadDocs()}catch(e){return {ok:false,error:"File update failed: "+e.message}}
    return {ok:true,file:{id:next.id,name:next.name,folder_path:atlasVaultFolderPath(next.folderId),category:next.area,tags:next.tags}};

  if(name==="browse_vault_folder"){

    atlasVaultFolderFilter=id||"all";atlasVaultSearch="";vaultPreview="";vaultMenu="";vaultSelectionMode=false;vaultSelected.clear();render();

    next.forEach(k=>vaultSelected.add(k));vaultSelectionMode=true;render();
    return {ok:true,selected:vaultSelected.size,items:[...vaultSelected]};
  }
  if(name==="select_all_vault_items"){
    const items=vaultVisible();if(!items.length)return {ok:false,error:"No items in current folder"};
    vaultSelectionMode=true;items.forEach(i=>vaultSelected.add(vaultKey(i.type,i.id)));render();
    return {ok:true,selected:vaultSelected.size,scope:"current folder"};
  }

  if(name==="batch_vault_action"){
    const action=clean(args.action);
    if(!["move","copy","tag","delete"].includes(action))return {ok:false,error:"Unsupported bulk action"};
    const items=vaultSelectedItems();if(!items.length)return {ok:false,error:"Select items first"};

    if(type==="folder"){const f=atlasVaultFolders.find(x=>x.id===id);return f?{ok:true,type,id,name:f.name,path:atlasVaultFolderPath(id),subfolders:atlasVaultFolders.filter(x=>x.parentId===id).length,files:docs.filter(x=>x.folderId===id).length}:{ok:false,error:"Folder not found"}}
    const d=docs.find(x=>x.id===id);return d?{ok:true,type:"file",id,name:d.name,category:d.area,tags:d.tags||[],size:d.size,mime_type:d.type,folder_path:atlasVaultFolderPath(d.folderId)}:{ok:false,error:"File not found"};
  }

  if(name==="analyze_vault_document")return await atlasAnalyzeDocument(args.file_id);
  if(name==="apply_vault_document_analysis")return await atlasApplyDocumentAnalysis(args.file_id);
  if(name==="suggest_vault_organization"){
    const suggestions=atlasImportSuggestions();

  }
  if(name==="apply_vault_suggestions"){

    return result.ok?{ok:true,action:name,changed:result.changed}:result;
  }
  if(name==="create_task"){
    const title=clean(args.title);if(!title)return {ok:false,error:"Task title is required."};
    const task={id:uid("task"),title,done:false,area:category(args.area),due:validDate(args.due),priority:priority(args.priority)};

  }
  if(name==="update_task"){

    const allowed=({notes:["text"],records:["title","area","type","date","tags","details"],people:["name","relationship","notes"],events:["title","date","area","details"]})[collection];
    let changes=0;
    for(const field of allowed){
      if(args[field]===undefined)continue;
      let value=field==="tags"?(Array.isArray(args.tags)?args.tags.map(clean).filter(Boolean):clean(args.tags).split(",").map(x=>x.trim()).filter(Boolean)):field==="date"?validDate(args.date):field==="area"?category(args.area):clean(args[field]);
      if(["title","name","text"].includes(field)&&!value)return {ok:false,error:field+" cannot be empty."};
      item[field]=value;changes++;
    }
    if(!changes)return {ok:false,error:"No changes specified."};
    save();toast("ATLAS item updated");return {ok:true,action:name,item};
  }
  if(name==="undo_last_action"){
    const latest=atlasActionHistory.find(e=>!e.undone);
    if(!latest)return {ok:false,error:"No recent AI action is available to undo on this device."};
    return atlasUndoAction(latest.id);
  }
  if(name==="search_atlas"){
    const q=clean(args.query).toLowerCase();if(!q)return {ok:false,error:"Search query is required."};
    const scope=clean(args.scope).toLowerCase()||"all";
    const hit=v=>String(v??"").toLowerCase().includes(q);
    const out={query:q,scope};
    if(scope==="all"||scope==="tasks")out.tasks=data.tasks.filter(t=>hit([t.title,t.area,t.priority,t.due].join(" "))).slice(0,25);
    if(scope==="all"||scope==="notes")out.notes=data.notes.filter(n=>hit(n.text)).slice(0,25);
    if(scope==="all"||scope==="events")out.events=data.events.filter(e=>hit([e.title,e.area,e.details,e.date].join(" "))).slice(0,25);
    if(scope==="all"||scope==="records")out.records=data.records.filter(r=>hit([r.title,r.area,r.type,r.details,(r.tags||[]).join(" ")].join(" "))).slice(0,25);
    if(scope==="all"||scope==="people")out.people=data.people.filter(p=>hit([p.name,p.relationship,p.notes].join(" "))).slice(0,25);
    if(scope==="all"||scope==="documents")out.documents=docs.filter(d=>hit([d.name,d.area,(d.tags||[]).join(" ")].join(" "))).slice(0,25).map(d=>({id:d.id,name:d.name,area:d.area,tags:d.tags,type:d.type,created:d.created}));
    return {ok:true,action:"search_results",results:out};
  }
  return {ok:false,error:"Unknown ATLAS action tool: "+name};
}
async function executeAtlasTool(name,args){
  const before=clone(data);
  const result=await executeAtlasToolImpl(name,args);
  if(result?.ok&&name!=="search_atlas"){
    const collection=({create_task:"tasks",update_task:"tasks",set_task_status:"tasks",create_note:"notes",create_record:"records",create_timeline_event:"events",create_person:"people",update_note:"notes",update_record:"records",update_person:"people",update_timeline_event:"events"})[name];
    if(collection){
      const oldItems=before[collection]||[],newItems=data[collection]||[];
      const changed=newItems.find(x=>JSON.stringify(x)!==JSON.stringify(oldItems.find(y=>y.id===x.id)));
      if(changed)atlasLogAction(name,collection,oldItems.find(x=>x.id===changed.id)||null,changed);
    }
  }

}
async function handleRealtimeToolCalls(calls){

function atlasVoiceControlIntent(text){
  let v=String(text||"").toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
  v=v.replace(/^(?:um|uh|erm|hmm|hey|okay|ok)\s+/,"");

  // End the live session. Keep this fairly strict so normal sentences about saying goodbye do not end ATLAS.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:good\s*bye|bye|end(?: the)? voice|stop(?: the)? voice|end(?: the)? session)(?:\s+atlas)?$/.test(v))return "end";

  // Mute/pause listening. Accept both direct commands and natural requests such as
  // “are you able to mute?”, “can you pause listening?”, or “stop listening please”.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:mute|pause|mute listening|pause listening|stop listening|stop hearing me)(?:\s+(?:please|atlas))?$/.test(v))return "mute";
  if(/^(?:atlas\s+)?(?:are you able to|can you|could you|would you|will you|would you please|could you please|can you please)\s+(?:mute|pause|mute listening|pause listening|stop listening|stop hearing me)(?:\s+(?:please|atlas))?$/.test(v))return "mute";
  if(/^(?:atlas\s+)?(?:please\s+)?(?:mute|pause)\s+(?:yourself|the mic|the microphone|your mic|your microphone|listening)(?:\s+(?:please|atlas))?$/.test(v))return "mute";

  // Resume listening. These are mainly useful when typed because a truly muted microphone cannot hear a voice command.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:unmute|listen|resume|resume listening|start listening|listen again|start listening again)(?:\s+(?:please|atlas))?$/.test(v))return "unmute";
  if(/^(?:atlas\s+)?(?:can you|could you|would you|will you)\s+(?:unmute|listen|resume listening|start listening|listen again)(?:\s+(?:please|atlas))?$/.test(v))return "unmute";
  return "";
}
function cancelAtlasVoiceResponse(){

async function setAtlasListening(shouldListen,{cancelResponse=false,quiet=false}={}){
  if(!atlasVoice.active||!atlasVoice.sender)return false;
  if(shouldListen&&!atlasVoice.muted){if(!quiet)toast("ATLAS is already listening");return true}
  if(!shouldListen&&atlasVoice.muted){if(!quiet)toast("ATLAS microphone is already paused");return true}

  if(!shouldListen){
    if(cancelResponse)cancelAtlasVoiceResponse();

    // Hard-stop microphone capture FIRST. This is the primary mute and is deliberately
    // independent of replaceTrack(null), which can behave inconsistently on mobile Safari.
    try{
      const senderTrack=atlasVoice.sender.track;
      if(senderTrack)senderTrack.enabled=false;
    }catch{}
    try{
      atlasVoice.stream?.getAudioTracks().forEach(track=>{
        try{track.enabled=false}catch{}
        try{track.stop()}catch{}
      });
    }catch{}

    // Clear any audio already queued for the Realtime session, then detach the ended track.
    try{
      if(atlasVoice.dc?.readyState==="open"){
        atlasVoice.dc.send(JSON.stringify({type:"input_audio_buffer.clear"}));
      }
    }catch{}
    try{await atlasVoice.sender.replaceTrack(null)}catch(err){console.warn("ATLAS replaceTrack(null) fallback:",err)}

    atlasVoice.stream=null;
    atlasVoice.muted=true;
    setVoiceStatus("paused");
    if(!quiet)toast("ATLAS paused • microphone capture stopped");
    return true;
  }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const track=stream.getAudioTracks()[0];
    if(!track)throw new Error("No microphone track was available.");
    track.enabled=true;
    await atlasVoice.sender.replaceTrack(track);
    atlasVoice.stream=stream;
    atlasVoice.muted=false;
    setVoiceStatus("listening");
    if(!quiet)toast("ATLAS is listening again");
    return true;
  }catch(err){
    console.error(err);
    toast("Microphone resume failed: "+(err.message||err));
    return false;
  }
}

async function runLocalVoiceControl(intent,{source="typed"}={}){
  if(intent==="end"){
    if(atlasVoice.active||atlasVoice.connecting){await endAtlasVoice();return "Voice session ended."}
    return "Voice is already off.";
  }
  if(intent==="mute"){
    if(!atlasVoice.active)return "Voice is not currently running.";
    const ok=await setAtlasListening(false,{cancelResponse:source==="spoken"});
    return ok?"Listening paused. Microphone capture is stopped.":"I could not pause the microphone.";
  }
  if(intent==="unmute"){
    if(atlasVoice.active){
      const ok=await setAtlasListening(true);
      return ok?"Listening resumed.":"I could not resume the microphone.";
    }
    await startAtlasVoice();
    return "Starting live voice.";
  }
  return "";
}
function handleRealtimeEvent(event){
  if(!event||!event.type)return;
  if(event.type==="input_audio_buffer.speech_started"){if(!atlasVoice.muted)setVoiceStatus("listening");return}
  if(event.type==="input_audio_buffer.speech_stopped"){if(!atlasVoice.muted)setVoiceStatus("thinking");return}
  if(event.type==="response.created"){atlasVoice.responseActive=true;if(!atlasVoice.muted)setVoiceStatus("thinking");return}
  if(event.type==="response.output_audio_transcript.delta"||event.type==="response.output_audio.delta"){if(!atlasVoice.muted)setVoiceStatus("speaking");return}
  if(event.type==="response.output_audio_transcript.done"){appendAtlasTranscript("assistant",event.transcript);return}
  if(event.type==="conversation.item.input_audio_transcription.completed"){
    appendAtlasTranscript("user",event.transcript);
    const intent=atlasVoiceControlIntent(event.transcript);
    if(intent){runLocalVoiceControl(intent,{source:"spoken"});return}
    return;
  }
  if(event.type==="response.done"){atlasVoice.responseActive=false;handleRealtimeResponseDone(event);return}
  if(event.type==="response.output_audio.done"){return}
  if(event.type==="error"){console.error("ATLAS realtime error",event);toast(event.error?.message||"ATLAS voice error");return}
}
async function startAtlasVoice(){
  if(atlasVoice.active||atlasVoice.connecting)return;
  const password=brainPassword();if(!password){toast("Unlock ATLAS first");return}
  const selected=$("#atlasVoiceSelect")?.value||atlasVoice.voice||"cedar";
  atlasVoice.voice=selected;localStorage.setItem("atlasVoiceName",selected);
  atlasVoice.connecting=true;setVoiceStatus("connecting");
  try{
    const tokenRes=await fetch(ATLAS_REALTIME_URL,{method:"POST",headers:{"Content-Type":"application/json","X-Atlas-Password":password},body:JSON.stringify({voice:selected,client_now:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||""})});
    const tokenBody=await tokenRes.json().catch(()=>({}));
    if(tokenRes.status===401){localStorage.removeItem("atlasBrainPassword");throw new Error("Your ATLAS access password was rejected.")}
    if(!tokenRes.ok||!tokenBody.value)throw new Error(tokenBody.detail||tokenBody.error||`Voice token request failed (${tokenRes.status}).`);

    const pc=new RTCPeerConnection();
    const audio=new Audio();audio.autoplay=true;audio.playsInline=true;
    pc.ontrack=e=>{audio.srcObject=e.streams[0];audio.play().catch(()=>{})};

    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const micTrack=stream.getAudioTracks()[0];
    if(!micTrack)throw new Error("No microphone track was available.");
    const sender=pc.addTrack(micTrack,stream);

    const dc=pc.createDataChannel("oai-events");
    dc.addEventListener("message",e=>{try{handleRealtimeEvent(JSON.parse(e.data))}catch(err){console.error(err)}});
    dc.addEventListener("open",()=>{atlasVoice.active=true;atlasVoice.connecting=false;setVoiceStatus("listening");toast("ATLAS voice connected")});
    dc.addEventListener("close",()=>{if(atlasVoice.active)cleanupAtlasVoice()});

    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdpRes=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",body:pc.localDescription.sdp,headers:{Authorization:`Bearer ${tokenBody.value}`,"Content-Type":"application/sdp"}});
    if(!sdpRes.ok)throw new Error(`Realtime connection failed (${sdpRes.status}): ${await sdpRes.text()}`);
    await pc.setRemoteDescription({type:"answer",sdp:await sdpRes.text()});

    atlasVoice.pc=pc;atlasVoice.dc=dc;atlasVoice.stream=stream;atlasVoice.audio=audio;atlasVoice.sender=sender;atlasVoice.muted=false;atlasVoice.responseActive=false;
  }catch(err){
    console.error(err);
    cleanupAtlasVoice();
    alert(`ATLAS Voice could not start:\n\n${err.message}`);
  }
}

function addPendingAtlasAttachment(doc){
  if(!doc||!doc.id)return;
  if(!atlasPendingAttachments.some(a=>a.id===doc.id))atlasPendingAttachments.push(atlasAttachmentMeta(doc));
}
async function storeAndAttachAtlasFiles(fileList,source="files"){
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  for(const f of files){
    const fallback=source==="camera"?"ATLAS Photo "+new Date().toLocaleString():f.name||"ATLAS attachment";
    const doc={id:uid("doc"),name:f.name||fallback,type:f.type||"application/octet-stream",size:f.size||0,created:new Date().toISOString(),tags:[],area:"General",blob:f};
    await putDoc(doc);
    docs=docs.filter(d=>d.id!==doc.id);
    docs.unshift(doc);
    addPendingAtlasAttachment(doc);
  }
  render();
  toast(files.length===1?"Attachment added":"Attachments added");
}

async function sendAtlasMessage(){
  if(atlasSending)return;
  const box=$("#atlasMessage");
  const typed=(box?.value||"").trim();
  const attachments=atlasPendingAttachments.map(a=>({...a}));
  if(!typed&&!attachments.length)return;

  const controlIntent=atlasVoiceControlIntent(typed);
  if(controlIntent&&!attachments.length){
    atlasChat.push({role:"user",content:typed,at:new Date().toISOString(),source:"control"});
    const result=await runLocalVoiceControl(controlIntent,{source:"typed"});
    atlasChat.push({role:"assistant",content:result,at:new Date().toISOString(),source:"control"});
    saveAtlasChat();render();
    return;
  }

  const password=brainPassword();
  if(!password)return;
  const history=atlasChat.slice(-12).map(m=>({role:m.role,content:m.content}));
  const displayMessage=typed||`Attached ${attachments.length===1?attachments[0].name:attachments.length+" files"}`;
  const attachmentNote=attachments.length
    ? `\n\nATLAS attachment metadata (the file bytes are stored locally in the ATLAS Library; this version cannot yet inspect the file contents):\n${attachments.map(a=>`- ${a.name} | ${a.type||"file"} | ${a.area||"General"}`).join("\n")}`
    : "";
  const apiMessage=typed+attachmentNote;

  atlasChat.push({role:"user",content:displayMessage,attachments,at:new Date().toISOString()});
  atlasPendingAttachments=[];
  saveAtlasChat();atlasSending=true;render();

  const callApi=async payload=>{
    const res=await fetch(ATLAS_API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Atlas-Password":password},
      body:JSON.stringify(payload)
    });
    const body=await res.json().catch(()=>({}));
    if(res.status===401){
      localStorage.removeItem("atlasBrainPassword");
      throw new Error("That ATLAS access password was rejected. Please unlock ATLAS again.");
    }
    if(!res.ok)throw new Error(body.detail||body.error||("ATLAS server returned "+res.status+"."));
    return body;
  };

  try{
    let body=await callApi({message:apiMessage,history,client_context:atlasClientContext()});
    let rounds=0;
    const seenActionCalls=new Set();
    while(Array.isArray(body.action_calls)&&body.action_calls.length&&rounds<5){
      const tool_results=[];
      for(const call of body.action_calls){
        let result;
        const signature=JSON.stringify([call.name,safeAtlasArgs(call.arguments)]);
        if(seenActionCalls.has(signature)){
          result={ok:false,error:"This action was already attempted in this request. Stop and report the prior result."};
        }else{
          seenActionCalls.add(signature);
          try{result=await executeAtlasTool(call.name,call.arguments)}
          catch(err){result={ok:false,error:err.message||String(err)}}
        }
        tool_results.push({call_id:call.call_id||"",name:call.name,result});
      }
      rounds++;
      body=await callApi({message:apiMessage,history,client_context:atlasClientContext(),tool_results,action_round:rounds});
    }
    if(Array.isArray(body.action_calls)&&body.action_calls.length){
      throw new Error("ATLAS stopped an unusually long action chain for safety. Please try the request again more specifically.");
    }
    atlasChat.push({role:"assistant",content:body.reply||"The ATLAS action completed.",at:new Date().toISOString()});
    saveAtlasChat();
  }catch(err){
    atlasChat.push({role:"assistant",content:"Connection error: "+err.message,at:new Date().toISOString()});
    saveAtlasChat();
  }finally{
    atlasSending=false;render();
    setTimeout(()=>{const w=$("#atlasChatWindow");if(w)w.scrollTop=w.scrollHeight},40);
  }
}

function wireTaskCategory(){
  const s=$("#taskArea");
  if(!s)return;
  s.onchange=()=>{
    if(s.value!=="__new__")return;
    const name=(prompt("Name your new category:","")||"").trim();
    if(!name){s.value="";return}
    if(!allCategories().some(x=>x.toLowerCase()===name.toLowerCase())){
      customCategories.push(name);
      localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
      queueAtlasSyncOp({type:"category_add",name});
    }
    s.innerHTML=areaOpts(name);
    s.value=name;
  };
}
function icsDate(d){return d.replaceAll("-","")}
function icsNextDate(d){
  const [y,m,day]=d.split("-").map(Number),x=new Date(y,m-1,day+1);
  return `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`;
}
function icsEsc(s=""){return String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
function addToIPhoneCalendar(task){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ATLAS//Task//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${task.id}@atlas`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${icsDate(task.due)}`,`DTEND;VALUE=DATE:${icsNextDate(task.due)}`,
    `SUMMARY:${icsEsc(task.title)}`,`DESCRIPTION:${icsEsc(`ATLAS task\nCategory: ${task.area}\nPriority: ${task.priority}`)}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`ATLAS-${task.title.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").slice(0,40)||"task"}.ics`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast("Calendar event created — open the .ics file and tap Add.");
}

$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
$("#themeBtn").onclick=()=>{document.documentElement.classList.toggle("light");localStorage.setItem("atlasTheme",document.documentElement.classList.contains("light")?"light":"dark")};
if(localStorage.getItem("atlasTheme")==="light")document.documentElement.classList.add("light");
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ATLAS-0.7.4.3-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("#importInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{data=normalize(JSON.parse(await f.text()));save();go("home");toast("Backup imported")}catch{alert("That file is not valid ATLAS JSON.")}};
greet();renderNav();render();loadDocs();
if(brainPassword())setTimeout(()=>atlasSyncNow({silent:true}),350);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&brainPassword())scheduleAtlasSync(250)});
window.addEventListener("focus",()=>{if(brainPassword())scheduleAtlasSync(300)});
</script>
