<style>
:root{--bg:#07111c;--panel:#0d1b2a;--panel2:#122337;--text:#eef4fb;--muted:#9fb0c2;--gold:#d6b66b;--gold2:#f1d78e;--line:rgba(255,255,255,.08);--shadow:0 18px 50px rgba(0,0,0,.28);--ok:#5fc58a;--danger:#e46d6d;--warn:#e0ad5d}
:root.light{--bg:#eef2f7;--panel:#fff;--panel2:#f6f8fb;--text:#132235;--muted:#66788d;--gold:#9a7625;--gold2:#c49a3c;--line:rgba(19,34,53,.10);--shadow:0 18px 50px rgba(34,55,80,.12)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:286px;background:linear-gradient(180deg,var(--panel),#091522);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:13px;align-items:center;padding:4px 6px 22px}.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#112033;font-weight:900;font-size:24px;box-shadow:var(--shadow)}.brand h1{margin:0;font-size:22px;letter-spacing:.18em}.brand p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.35;max-width:180px}.version{display:inline-block;margin-top:4px;color:var(--gold);font-size:10px}.nav-list{display:grid;gap:6px;overflow:auto}.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left}.nav-item:hover,.nav-item.active{background:rgba(214,182,107,.12);color:var(--gold2)}.nav-icon{width:26px;text-align:center}.sidebar-footer{margin-top:auto;display:grid;gap:8px;padding-top:10px}
.ghost-btn,.file-label{border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:center}.main{margin-left:286px;min-height:100vh;padding:20px 26px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:env(safe-area-inset-top);background:rgba(7,17,28,.88);backdrop-filter:blur(18px);padding:10px 0 18px;z-index:10}.light .topbar{background:rgba(238,242,247,.88)}.topbar h2{margin:3px 0 0;font-size:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold)}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:12px}.hero{display:grid;gap:12px;margin-bottom:22px}.search-wrap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 16px;box-shadow:var(--shadow)}.search-wrap input{width:100%;padding:15px 0;border:0;outline:0;background:transparent;color:var(--text)}.voice-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid rgba(214,182,107,.25);padding:14px;border-radius:18px}.mic-btn{width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 0 rgba(214,182,107,.35);font-size:24px}.mic-btn.listening{animation:pulse 1.15s infinite}@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(214,182,107,0)}100%{box-shadow:0 0 0 0 rgba(214,182,107,0)}}.voice-title{font-weight:800}.voice-status{color:var(--muted);font-size:13px;margin-top:4px}.primary-btn{border:0;border-radius:12px;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px}.danger-btn{border:1px solid rgba(228,109,109,.35);background:transparent;color:var(--danger);border-radius:10px;padding:8px 10px}textarea{resize:vertical;min-height:60px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;outline:0}
.grid{display:grid;gap:14px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 10px;font-size:16px}.card .big{font-size:30px;font-weight:900;color:var(--gold2)}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.section-title h3{margin:0}.quick-card{display:flex;gap:13px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:16px}.quick-icon{font-size:26px}.list{display:grid;gap:9px}.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}.list-item.done .item-title{text-decoration:line-through;opacity:.6}.item-title{font-weight:700}.check{width:20px;height:20px}.small-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .wide{grid-column:1/-1}.form-grid input,.form-grid select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);margin:2px}.pill.high{color:#ff9b9b}.pill.medium{color:#ffd18b}.pill.low{color:#8fd7ab}.mobile-nav{display:none}.mobile-only{display:none}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#111d2b;color:#fff;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.doc-preview{width:54px;height:54px;border-radius:10px;background:var(--panel);display:grid;place-items:center;overflow:hidden}.doc-preview img{width:100%;height:100%;object-fit:cover}.timeline{position:relative;padding-left:24px}.timeline:before{content:"";position:absolute;left:11px;top:18px;bottom:18px;width:2px;background:var(--line)}.timeline-item{position:relative;margin-bottom:18px}.timeline-item:before{content:"";position:absolute;left:-18px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--gold)}.badge-ok{color:var(--ok)}.upload-zone{border:1px dashed rgba(214,182,107,.45);border-radius:16px;padding:18px;text-align:center;background:rgba(214,182,107,.05)}.upload-zone input{display:none}.upload-label{display:inline-block;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px;border-radius:12px}.record-body{white-space:pre-wrap;line-height:1.5}.kicker{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
.field-label{display:block;font-size:12px;font-weight:800;color:var(--gold);margin:2px 0 6px}.field-help{font-size:12px;color:var(--muted);margin-top:6px}.calendar-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text)}.calendar-option input{width:20px;height:20px}

.task-check{width:30px;height:30px;border:2px solid rgba(238,244,251,.72);border-radius:8px;background:rgba(255,255,255,.04);color:#102033;padding:0;display:grid;place-items:center;flex:0 0 30px;transition:background .18s ease,border-color .18s ease,transform .18s ease;appearance:none;-webkit-appearance:none}
.task-check::after{content:"✓";font-size:21px;font-weight:900;line-height:1;color:#102033;opacity:0;transform:scale(.25) rotate(-18deg);transition:opacity .18s ease,transform .22s cubic-bezier(.2,.9,.2,1.4)}
.task-check.checked{background:var(--gold2);border-color:var(--gold2)}
.task-check.checked::after{opacity:1;transform:scale(1) rotate(0)}
.task-check.animating{animation:taskCheckPop .42s ease}
.list-item.task-finishing{animation:taskFinish .48s ease forwards}
@keyframes taskCheckPop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes taskFinish{0%{opacity:1;transform:translateX(0)}72%{opacity:.78;transform:translateX(4px)}100%{opacity:0;transform:translateX(16px)}}
.task-action{min-width:150px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px}.edit-banner{border:1px solid rgba(214,182,107,.35);background:rgba(214,182,107,.08);padding:12px 14px;border-radius:12px;margin-bottom:12px}.button-row{display:flex;gap:8px;flex-wrap:wrap}

:root{--cyan:#62d9ff;--cyan2:#87eeff}
.brain-launch{position:relative;overflow:hidden;background:
radial-gradient(circle at 12% 25%,rgba(98,217,255,.18),transparent 26%),
radial-gradient(circle at 88% 15%,rgba(241,215,142,.17),transparent 28%),
linear-gradient(135deg,#10263b,var(--panel));border:1px solid rgba(98,217,255,.26)}
.brain-launch:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(98,217,255,.035) 25px 26px)}
.brain-launch-inner{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.atlas-orb{position:relative;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:
radial-gradient(circle at 38% 30%,#fff7cf 0 4%,var(--gold2) 5% 16%,#32677f 18% 38%,#10263b 40% 58%,#07111c 61%);
box-shadow:0 0 0 1px rgba(241,215,142,.5),0 0 28px rgba(98,217,255,.34),inset 0 0 28px rgba(98,217,255,.3)}
.atlas-orb:before,.atlas-orb:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(98,217,255,.52)}
.atlas-orb:before{inset:-8px;transform:rotate(18deg)}.atlas-orb:after{inset:10px;border-color:rgba(241,215,142,.55)}
.atlas-orb-glyph{font-weight:950;font-size:28px;color:white;text-shadow:0 0 16px var(--cyan);letter-spacing:.08em}
.brain-kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan2)}
.brain-title{font-size:22px;font-weight:900;margin:3px 0}.brain-copy{color:var(--muted);font-size:13px;line-height:1.45}
.brain-status{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(98,217,255,.28);border-radius:999px;padding:6px 9px;color:var(--cyan2);font-size:11px}
.brain-status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.brain-shell{display:grid;gap:14px}
.brain-header{position:relative;overflow:hidden;background:
linear-gradient(135deg,rgba(98,217,255,.08),rgba(214,182,107,.08)),var(--panel);
border:1px solid rgba(98,217,255,.22);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.brain-header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,transparent 18px 27px,var(--cyan) 27px 45px,transparent 45px 54px);opacity:.65}
.brain-head-grid{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;position:relative}
.brain-lock{max-width:540px;margin:22px auto;background:var(--panel);border:1px solid rgba(214,182,107,.28);border-radius:18px;padding:20px;text-align:center}
.brain-lock input{width:100%;margin:10px 0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px}
.chat-window{height:min(54vh,560px);min-height:360px;overflow:auto;padding:15px;background:
linear-gradient(rgba(7,17,28,.79),rgba(7,17,28,.91)),
radial-gradient(circle at 50% 0,rgba(98,217,255,.12),transparent 44%);
border:1px solid var(--line);border-radius:18px;scroll-behavior:smooth}
.chat-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.chat-msg{display:flex;margin:10px 0}.chat-msg.user{justify-content:flex-end}.chat-bubble{max-width:min(82%,680px);padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.chat-msg.assistant .chat-bubble{background:linear-gradient(135deg,rgba(98,217,255,.10),rgba(18,35,55,.96));border:1px solid rgba(98,217,255,.22);border-bottom-left-radius:5px}
.chat-msg.user .chat-bubble{background:linear-gradient(135deg,rgba(214,182,107,.28),rgba(214,182,107,.15));border:1px solid rgba(241,215,142,.34);border-bottom-right-radius:5px}
.chat-role{font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px;color:var(--cyan2)}.chat-msg.user .chat-role{color:var(--gold2)}
.atlas-composer-wrap{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:12;padding-top:8px;background:linear-gradient(180deg,rgba(8,20,33,0),rgba(8,20,33,.94) 28%,rgba(8,20,33,.98))}
.atlas-composer{display:flex;align-items:flex-end;gap:7px;padding:8px 9px;border:1px solid rgba(147,181,205,.24);border-radius:26px;background:rgba(18,31,46,.96);box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(18px)}
.atlas-composer textarea{flex:1;min-width:0;min-height:42px;max-height:150px;resize:none;border:0!important;background:transparent!important;box-shadow:none!important;padding:10px 4px 7px;color:var(--text);font:inherit;line-height:1.35;outline:none}
.atlas-composer textarea::placeholder{color:rgba(184,201,215,.58)}
.composer-icon-btn{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--text);cursor:pointer;transition:.18s ease}
.composer-icon-btn svg{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.composer-icon-btn:hover,.composer-icon-btn:active{background:rgba(98,217,255,.12)}
.composer-icon-btn.voice-active{color:var(--cyan2);background:rgba(98,217,255,.12);box-shadow:inset 0 0 0 1px rgba(98,217,255,.24)}
.composer-icon-btn.muted-active{color:#ffb0b0;background:rgba(228,109,109,.12)}
.composer-icon-btn:disabled{opacity:.28;cursor:default;background:transparent;box-shadow:none}
.composer-send{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan2),var(--gold2));color:#07111c;cursor:pointer;box-shadow:0 5px 18px rgba(98,217,255,.16)}
.composer-send:disabled{opacity:.35;cursor:default}
.composer-send svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.composer-plus{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--text);cursor:pointer;transition:.18s ease}
.composer-plus:hover,.composer-plus:active{background:rgba(255,255,255,.08)}
.composer-plus svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.composer-primary{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.18s ease}
.composer-primary svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
.composer-primary.voice-mode{background:rgba(240,245,249,.94);color:#0a1521}
.composer-primary.voice-mode.voice-active{background:var(--cyan2);color:#07111c;box-shadow:0 0 0 4px rgba(98,217,255,.12),0 0 20px rgba(98,217,255,.24)}
.composer-primary.voice-mode.voice-speaking{animation:voicePulse .85s infinite}
.composer-primary.send-mode{background:linear-gradient(135deg,var(--cyan2),var(--gold2));color:#07111c;box-shadow:0 5px 18px rgba(98,217,255,.16)}
.composer-primary:disabled{opacity:.35;cursor:default}
.atlas-attachment-row{display:flex;gap:7px;overflow-x:auto;padding:0 4px 7px;scrollbar-width:none}
.atlas-attachment-row:empty{display:none}.atlas-attachment-row::-webkit-scrollbar{display:none}
.atlas-attachment-chip{display:flex;align-items:center;gap:6px;max-width:220px;padding:7px 8px 7px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-size:11px;white-space:nowrap}
.atlas-attachment-chip span{overflow:hidden;text-overflow:ellipsis}.atlas-attachment-chip button{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.atlas-attach-menu{position:absolute;left:0;bottom:calc(100% - 2px);width:min(320px,calc(100vw - 34px));padding:8px;border:1px solid var(--line);border-radius:18px;background:rgba(18,31,46,.98);box-shadow:0 18px 44px rgba(0,0,0,.42);backdrop-filter:blur(20px);z-index:40}
.atlas-attach-menu[hidden],.atlas-library-picker[hidden]{display:none!important}
.atlas-attach-menu button,.atlas-library-picker button{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;text-align:left;font:inherit}
.atlas-attach-menu button:hover,.atlas-attach-menu button:active,.atlas-library-picker button:hover,.atlas-library-picker button:active{background:rgba(98,217,255,.10)}
.attach-menu-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(98,217,255,.10);font-size:15px}
.atlas-library-picker{max-height:300px;overflow:auto}
.atlas-library-head{display:flex;align-items:center;justify-content:space-between;padding:5px 8px 7px;color:var(--muted);font-size:11px}
.atlas-library-doc{border-top:1px solid rgba(147,181,205,.10)!important;border-radius:0!important}
.atlas-library-doc small{display:block;color:var(--muted);margin-top:2px}
.brain-tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.brain-tools-left,.brain-tools-right{display:flex;gap:8px;flex-wrap:wrap}
.thinking-dots{display:inline-flex;gap:5px;align-items:center}.thinking-dots i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:brainDot 1s infinite ease-in-out}.thinking-dots i:nth-child(2){animation-delay:.15s}.thinking-dots i:nth-child(3){animation-delay:.3s}@keyframes brainDot{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}
.mythic-divider{height:8px;margin:2px 0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(214,182,107,.45) 8px 11px,transparent 11px 18px,rgba(98,217,255,.3) 18px 21px,transparent 21px 29px);opacity:.65}

.voice-console{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(10,30,48,.96),rgba(12,23,38,.98));border:1px solid rgba(98,217,255,.26);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.voice-console:before{content:"";position:absolute;inset:0;pointer-events:none;background:
radial-gradient(circle at 16% 30%,rgba(98,217,255,.14),transparent 30%),
linear-gradient(90deg,transparent 0 48%,rgba(214,182,107,.04) 49%,transparent 50%)}
.voice-grid{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.voice-orb{width:112px;height:112px;border-radius:50%;position:relative;display:grid;place-items:center;background:
radial-gradient(circle at 38% 30%,#fff8cd 0 4%,#dfbd68 5% 13%,#4ca8bb 15% 26%,#153c5b 28% 45%,#081727 47% 63%,#040a12 66%);
box-shadow:0 0 0 1px rgba(241,215,142,.48),0 0 34px rgba(98,217,255,.26),inset 0 0 30px rgba(98,217,255,.24);transition:.25s}
.voice-orb:before,.voice-orb:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(98,217,255,.55);inset:-9px}
.voice-orb:after{inset:10px;border-color:rgba(241,215,142,.58);transform:rotate(45deg)}
.voice-orb .atlas-orb-glyph{font-size:34px}
.voice-orb.connecting{animation:voicePulse 1.2s infinite}
.voice-orb.listening{box-shadow:0 0 0 1px rgba(241,215,142,.55),0 0 42px rgba(98,217,255,.7),inset 0 0 34px rgba(98,217,255,.35);animation:voiceBreathe 1.6s infinite ease-in-out}
.voice-orb.thinking{animation:voiceSpinGlow 1.9s infinite linear}
.voice-orb.speaking{box-shadow:0 0 0 1px rgba(241,215,142,.8),0 0 52px rgba(241,215,142,.62),inset 0 0 38px rgba(98,217,255,.35);animation:voiceSpeak .72s infinite alternate ease-in-out}
@keyframes voicePulse{50%{transform:scale(1.05);filter:brightness(1.18)}}@keyframes voiceBreathe{50%{transform:scale(1.035)}}@keyframes voiceSpinGlow{50%{filter:hue-rotate(24deg) brightness(1.15);transform:rotate(2deg)}}@keyframes voiceSpeak{to{transform:scale(1.055)}}
.voice-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.voice-live-title{font-size:20px;font-weight:900}.voice-live-copy{font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px}
.voice-status-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--cyan2)}.voice-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.voice-dot.live{background:var(--ok);box-shadow:0 0 12px var(--ok)}.voice-dot.busy{background:var(--gold2);box-shadow:0 0 12px var(--gold2)}
.voice-controls{position:relative;display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-top:16px}.voice-controls select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}
.voice-btn-live{border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan2),var(--gold2));color:#07111c;font-weight:900;padding:11px 16px}.voice-btn-end{background:rgba(228,109,109,.16);color:#ff9b9b;border:1px solid rgba(228,109,109,.4)}
.voice-note{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.4}
@media(max-width:1050px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}.mobile-only{display:inline-grid;place-items:center}.topbar h2{font-size:23px}.grid.cols-4,.grid.cols-3,.grid.cols-2,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(13,27,42,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}.mobile-nav .nav-item{display:grid;place-items:center;gap:2px;padding:5px 2px;font-size:10px}.mobile-nav .nav-icon{font-size:18px}.brain-launch-inner,.brain-head-grid{grid-template-columns:auto 1fr}.voice-grid{grid-template-columns:1fr;text-align:center}.voice-orb{margin:0 auto}.voice-controls{grid-template-columns:1fr 1fr}.voice-controls select{grid-column:1/-1}.brain-launch-inner .primary-btn,.brain-head-grid .brain-status{grid-column:1/-1}.atlas-composer-wrap{bottom:calc(72px + env(safe-area-inset-bottom))}.atlas-composer{gap:4px;padding:7px 8px}.composer-icon-btn,.composer-send{width:38px;height:38px;flex-basis:38px}.atlas-orb{width:72px;height:72px}.voice-card{grid-template-columns:auto 1fr}.voice-card .primary-btn{grid-column:1/-1}.list-item{grid-template-columns:auto 1fr}.list-item> :last-child{grid-column:2}}
</style>

<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">A</div><div><h1>ATLAS</h1><p>Advanced Tracking, Library & Archival System</p><span class="version">0.6.5 • Action Tools</span></div></div>
  <nav id="desktopNav" class="nav-list"></nav>
  <div class="sidebar-footer">
    <button class="ghost-btn" id="exportBtn">Export backup</button>
    <label class="ghost-btn file-label">Import backup<input id="importInput" type="file" accept="application/json" hidden></label>
  </div>
</aside>
<main class="main">
  <header class="topbar"><button class="icon-btn mobile-only" id="menuBtn">☰</button><div><div class="eyebrow" id="greeting"></div><h2 id="pageTitle">Command Center</h2></div><button class="icon-btn" id="themeBtn">◐</button></header>
  <section class="hero">
    <div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Search tasks, notes, records, documents, people and events…" autocomplete="off"></div>
  </section>
  <section id="content"></section>
</main>
<nav id="mobileNav" class="mobile-nav"></nav>
<div id="toast" class="toast"></div>

<script>
const VERSION="0.6.5";
const NAV=[["home","⌂","Home"],["atlas","✦","ATLAS Brain"],["inbox","✉","Inbox"],["actions","✓","Action Center"],["library","🗂","Library"],["timeline","◷","Timeline"],["medical","✚","Medical"],["legal","⚖","Legal"],["housing","⌂","Housing"],["finance","$","Finance"],["vehicles","🚗","Vehicles"],["pets","🐈","Pets"],["people","👥","People"],["knowledge","📚","Knowledge"],["settings","⚙","Settings"]];
const AREAS=["General","Medical","Legal","Housing","Finance","Vehicles","Pets","People","Knowledge"];
const defaults={version:3,tasks:[{id:"seed1",title:"Follow up on BMW claim",done:false,area:"Legal",due:"",priority:"high"},{id:"seed2",title:"Review LADWP payment arrangement",done:false,area:"Housing",due:"",priority:"medium"},{id:"seed3",title:"Track kitten vaccinations",done:false,area:"Pets",due:"",priority:"medium"}],notes:[],events:[{id:"event1",date:"2026-05-03",title:"BMW collision",area:"Vehicles",details:"Rear collision; vehicle became undrivable."}],people:[{id:"p1",name:"Luis",relationship:"Partner",notes:"Household member"},{id:"p2",name:"Gerardo Zaldivar",relationship:"LACDA caseworker",notes:"Housing contact"}],records:[],sections:{medical:["Providers","Medications","Lab results","Procedures","Insurance"],legal:["Active matters","Evidence","Correspondence","Deadlines","Contacts"],housing:["Lease","LACDA","Utilities","Repairs","Inspections"],finance:["Banking","Bills","Benefits","Receipts","Taxes"],vehicles:["BMW","E-bikes","Scooter","Insurance","Maintenance"],pets:["Profiles","Vaccinations","Vet records","Photos","Medications"],knowledge:["Reference notes","Research","How-to guides","Important records"]}};
const $=s=>document.querySelector(s),content=$("#content"),pageTitle=$("#pageTitle");
const ATLAS_BACKEND_ORIGIN=location.hostname.endsWith(".vercel.app")?location.origin:"https://atlas-three-ochre.vercel.app";
const ATLAS_API_URL=ATLAS_BACKEND_ORIGIN+"/api/chat";
const ATLAS_REALTIME_URL=ATLAS_BACKEND_ORIGIN+"/api/realtime";
const ATLAS_SYNC_URL=ATLAS_BACKEND_ORIGIN+"/api/sync";
let currentPage="home",docs=[],editingTaskId=null,atlasSending=false,
customCategories=JSON.parse(localStorage.getItem("atlasCustomCategories")||"[]"),
atlasChat=JSON.parse(localStorage.getItem("atlasChatV1")||"[]");
let atlasVoice={
  pc:null,dc:null,stream:null,audio:null,sender:null,
  active:false,connecting:false,muted:false,status:"idle",responseActive:false,
  voice:localStorage.getItem("atlasVoiceName")||"cedar"
};
let atlasPendingAttachments=[];

let atlasSyncApplying=false;
let atlasSync={
  status:"idle",
  inFlight:false,
  timer:null,
  revision:Number(localStorage.getItem("atlasSyncRevision")||0)||0,
  initialized:localStorage.getItem("atlasSyncInitialized")==="1",
  lastSync:localStorage.getItem("atlasSyncLastAt")||"",
  deviceId:localStorage.getItem("atlasSyncDeviceId")||""
};
if(!atlasSync.deviceId){
  atlasSync.deviceId="device-"+Date.now()+"-"+Math.random().toString(36).slice(2,10);
  localStorage.setItem("atlasSyncDeviceId",atlasSync.deviceId);
}
let atlasSyncOps=(()=>{try{const x=JSON.parse(localStorage.getItem("atlasSyncOps")||"[]");return Array.isArray(x)?x:[]}catch{return[]}})();

function clone(o){return JSON.parse(JSON.stringify(o))}
function normalize(raw){const b=clone(defaults);raw=raw&&typeof raw==="object"?raw:{};return{version:3,tasks:Array.isArray(raw.tasks)?raw.tasks.map(t=>({id:String(t.id||uid()),title:String(t.title||"Untitled task"),done:!!t.done,area:t.area||"General",due:t.due||"",priority:t.priority||"medium"})):b.tasks,notes:Array.isArray(raw.notes)?raw.notes:[],events:Array.isArray(raw.events)?raw.events:[],people:Array.isArray(raw.people)?raw.people:[],records:Array.isArray(raw.records)?raw.records:[],sections:raw.sections||b.sections}}
function loadData(){for(const key of ["atlasDataV3","atlasDataV2","atlasData"]){const x=localStorage.getItem(key);if(x){try{const d=normalize(JSON.parse(x));localStorage.setItem("atlasDataV3",JSON.stringify(d));return d}catch{}}}return clone(defaults)}
let data=loadData();
let atlasLastSavedData=clone(data);

function uid(p="id"){return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function atlasNow(){return new Date().toISOString()}
function atlasSyncOpId(){return "op-"+Date.now()+"-"+Math.random().toString(36).slice(2,10)}
function atlasMessageKey(m){
  if(m&&m._syncId)return String(m._syncId);
  const s=[m?.role||"",m?.at||"",m?.source||"",m?.content||""].join("|");
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return "msg-"+(h>>>0).toString(36)+"-"+String(m?.at||"").replace(/\D/g,"").slice(-8);
}
function ensureAtlasMessageIds(list){
  return (Array.isArray(list)?list:[]).map(m=>({...m,_syncId:atlasMessageKey(m)}));
}
atlasChat=ensureAtlasMessageIds(atlasChat);
let atlasLastSavedChat=clone(atlasChat);

function saveAtlasSyncOps(){localStorage.setItem("atlasSyncOps",JSON.stringify(atlasSyncOps.slice(-1000)))}
function queueAtlasSyncOp(op){
  if(atlasSyncApplying||!op)return;
  atlasSyncOps.push({id:atlasSyncOpId(),at:atlasNow(),...op});
  saveAtlasSyncOps();
  scheduleAtlasSync();
}
function atlasCollections(x){return{tasks:x.tasks||[],notes:x.notes||[],events:x.events||[],people:x.people||[],records:x.records||[]}}
function queueAtlasDataDiff(before,after){
  if(atlasSyncApplying)return;
  const a=atlasCollections(before||{}),b=atlasCollections(after||{});
  for(const collection of Object.keys(b)){
    const oldMap=new Map((a[collection]||[]).map(x=>[String(x.id),x]));
    const newMap=new Map((b[collection]||[]).map(x=>[String(x.id),x]));
    for(const [id,item] of newMap){
      const prev=oldMap.get(id);
      if(!prev||JSON.stringify(prev)!==JSON.stringify(item))queueAtlasSyncOp({type:"upsert",collection,item:clone(item)});
    }
    for(const [id] of oldMap)if(!newMap.has(id))queueAtlasSyncOp({type:"delete",collection,id});
  }
}
function save(){
  const before=atlasLastSavedData;
  localStorage.setItem("atlasDataV3",JSON.stringify(data));
  queueAtlasDataDiff(before,data);
  atlasLastSavedData=clone(data);
}
function atlasSyncStateLabel(){
  if(!brainPassword())return"Sync locked";
  if(atlasSync.status==="syncing")return"Syncing…";
  if(atlasSync.status==="error")return"Sync retrying";
  if(atlasSync.lastSync)return"Synced";
  return"Sync ready";
}
function updateAtlasSyncBadge(){
  const el=$("#atlasSyncBadge");if(el)el.textContent=atlasSyncStateLabel();
}
function scheduleAtlasSync(delay=550){
  if(!brainPassword())return;
  clearTimeout(atlasSync.timer);
  atlasSync.timer=setTimeout(()=>atlasSyncNow({silent:true}),delay);
}
function applyAtlasOpLocal(op){
  if(!op)return;
  if(op.type==="upsert"&&["tasks","notes","events","people","records"].includes(op.collection)&&op.item?.id){
    const list=data[op.collection]||[];
    const i=list.findIndex(x=>String(x.id)===String(op.item.id));
    if(i>=0)list[i]=clone(op.item);else list.unshift(clone(op.item));
    return;
  }
  if(op.type==="delete"&&["tasks","notes","events","people","records"].includes(op.collection)){
    data[op.collection]=(data[op.collection]||[]).filter(x=>String(x.id)!==String(op.id));return;
  }
  if(op.type==="chat_upsert"&&op.message){
    const msg={...clone(op.message),_syncId:atlasMessageKey(op.message)};
    const i=atlasChat.findIndex(x=>atlasMessageKey(x)===msg._syncId);
    if(i>=0)atlasChat[i]=msg;else atlasChat.push(msg);return;
  }
  if(op.type==="chat_clear"){atlasChat=[];return}
  if(op.type==="category_add"&&op.name&&!customCategories.some(x=>x.toLowerCase()===String(op.name).toLowerCase()))customCategories.push(String(op.name));
}
function applyAtlasServerState(state,pendingOps=[]){
  atlasSyncApplying=true;
  try{
    if(state?.data)data=normalize(state.data);
    atlasChat=ensureAtlasMessageIds(state?.chat||[]).slice(-100);
    customCategories=Array.isArray(state?.customCategories)?state.customCategories.map(String):[];
    for(const op of pendingOps)applyAtlasOpLocal(op);
    localStorage.setItem("atlasDataV3",JSON.stringify(data));
    localStorage.setItem("atlasChatV1",JSON.stringify(atlasChat.slice(-100)));
    localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
    atlasLastSavedData=clone(data);
    atlasLastSavedChat=clone(atlasChat);
  }finally{atlasSyncApplying=false}
}
async function atlasSyncNow({silent=false}={}){
  const password=brainPassword();
  if(!password||atlasSync.inFlight)return false;
  atlasSync.inFlight=true;atlasSync.status="syncing";updateAtlasSyncBadge();
  const sentOps=atlasSyncOps.map(clone);
  const seed=!atlasSync.initialized?{data:clone(data),chat:ensureAtlasMessageIds(atlasChat),customCategories:[...customCategories]}:null;
  try{
    const res=await fetch(ATLAS_SYNC_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Atlas-Password":password},
      body:JSON.stringify({device_id:atlasSync.deviceId,client_revision:atlasSync.revision,seed,ops:sentOps})
    });
    const body=await res.json().catch(()=>({}));
    if(res.status===401){localStorage.removeItem("atlasBrainPassword");throw new Error("ATLAS sync password rejected.")}
    if(!res.ok)throw new Error(body.detail||body.error||("Sync failed ("+res.status+")."));
    const sentIds=new Set(sentOps.map(x=>x.id));
    atlasSyncOps=atlasSyncOps.filter(x=>!sentIds.has(x.id));
    saveAtlasSyncOps();
    applyAtlasServerState(body.state,atlasSyncOps);
    atlasSync.revision=Number(body.revision||0)||0;
    atlasSync.initialized=true;
    atlasSync.lastSync=body.updated_at||atlasNow();
    atlasSync.status="ok";
    localStorage.setItem("atlasSyncRevision",String(atlasSync.revision));
    localStorage.setItem("atlasSyncInitialized","1");
    localStorage.setItem("atlasSyncLastAt",atlasSync.lastSync);
    if(currentPage==="atlas"||currentPage==="home"||currentPage==="actions"||currentPage==="inbox"||currentPage==="timeline"||currentPage==="people")render();
    if(atlasSyncOps.length)scheduleAtlasSync(250);
    return true;
  }catch(err){
    console.error("ATLAS sync error",err);
    atlasSync.status="error";updateAtlasSyncBadge();
    if(!silent)toast("ATLAS sync will retry");
    return false;
  }finally{atlasSync.inFlight=false;updateAtlasSyncBadge()}
}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function fmt(d){if(!d)return"";const x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function allCategories(){return [...new Set([...AREAS,...customCategories])]}
function areaOpts(sel=""){return `<option value="" ${sel?"":"selected"} disabled>Category</option>`+allCategories().map(a=>`<option value="${esc(a)}" ${a===sel?"selected":""}>${esc(a)}</option>`).join("")+`<option value="__new__">＋ Add a new category…</option>`}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("atlasFiles",1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("documents"))db.createObjectStore("documents",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadDocs(){try{const db=await openDB();docs=await new Promise((res,rej)=>{const r=db.transaction("documents").objectStore("documents").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});render()}catch(e){console.error(e)}}
async function putDoc(doc){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction("documents","readwrite").objectStore("documents").put(doc);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
async function deleteDoc(id){const db=await openDB();await new Promise((res,rej)=>{const r=db.transaction("documents","readwrite").objectStore("documents").delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)});await loadDocs();toast("Document deleted")}
function renderNav(){const make=a=>a.map(([id,ic,l])=>`<button class="nav-item ${currentPage===id?"active":""}" data-page="${id}"><span class="nav-icon">${ic}</span><span>${l}</span></button>`).join("");$("#desktopNav").innerHTML=make(NAV);const mobileIds=["home","atlas","actions","library","timeline"];$("#mobileNav").innerHTML=make(mobileIds.map(id=>NAV.find(n=>n[0]===id)).filter(Boolean));document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){if(p!=="actions")editingTaskId=null;currentPage=p;$("#sidebar").classList.remove("open");$("#globalSearch").value="";renderNav();render()}
function greet(){const h=new Date().getHours();$("#greeting").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+" • ATLAS "+VERSION}
function taskList(ts){if(!ts.length)return`<div class="empty">Nothing here yet.</div>`;return`<div class="list">${ts.map(t=>`<div class="list-item ${t.done?"done":""}"><button class="task-check ${t.done?"checked":""}" data-task-check="${esc(t.id)}" aria-label="${t.done?"Mark task incomplete":"Mark task completed"}"></button><div><div class="item-title">${esc(t.title)}</div><span class="pill">${esc(t.area)}</span><span class="pill ${esc(t.priority)}">${esc(t.priority)}</span>${t.due?`<span class="pill">${esc(fmt(t.due))}</span>`:""}</div><select class="task-action" data-task-action="${esc(t.id)}"><option value="" selected>Task actions…</option><option value="edit">Edit</option><option value="${t.done?"incomplete":"complete"}">${t.done?"Mark Incomplete":"Mark Completed"}</option><option value="delete">Delete</option></select></div>`).join("")}</div>`}
function timelineList(ev){if(!ev.length)return`<div class="empty">No events yet.</div>`;return`<div class="card timeline">${ev.map(e=>`<div class="timeline-item"><strong>${esc(e.title)}</strong><div class="muted">${esc(fmt(e.date))} • ${esc(e.area||"General")}</div>${e.details?`<div class="record-body">${esc(e.details)}</div>`:""}<button class="small-btn" data-event-delete="${esc(e.id)}">Delete</button></div>`).join("")}</div>`}
function dashboard(){const p={high:0,medium:1,low:2};const open=[...data.tasks].filter(t=>!t.done).sort((a,b)=>(p[a.priority]??1)-(p[b.priority]??1));const quickIds=["library","timeline","medical","legal","housing","finance","vehicles","pets","people","knowledge"];return`<div class="card brain-launch"><div class="brain-launch-inner"><div class="atlas-orb"><span class="atlas-orb-glyph">A</span></div><div><div class="brain-kicker">ATLAS 0.6.5 • Actions</div><div class="brain-title">Your private ATLAS intelligence can now act.</div><div class="brain-copy">Chat, tasks, notes, records, timeline and people now sync privately between your ATLAS Home Screen app and Safari. Documents remain local to each device for now.</div></div><button class="primary-btn" data-open="atlas">Open ATLAS</button></div></div><div class="mythic-divider"></div><div class="grid cols-4"><div class="card"><h3>Open tasks</h3><div class="big">${open.length}</div><div class="muted">Across ATLAS</div></div><div class="card"><h3>Inbox</h3><div class="big">${data.notes.length}</div><div class="muted">Notes and captures</div></div><div class="card"><h3>Records</h3><div class="big">${data.records.length}</div><div class="muted">Structured records</div></div><div class="card"><h3>Documents</h3><div class="big">${docs.length}</div><div class="muted">Stored on this device</div></div></div><div class="section-title"><h3>Quick access</h3></div><div class="grid cols-4">${quickIds.map(id=>NAV.find(n=>n[0]===id)).filter(Boolean).map(([id,ic,l])=>`<button class="quick-card" data-open="${id}"><span class="quick-icon">${ic}</span><span><strong>${l}</strong><br><small class="muted">Open workspace</small></span></button>`).join("")}</div><div class="section-title"><h3>Priority tasks</h3><button class="small-btn" data-open="actions">View all</button></div>${taskList(open.slice(0,6))}<div class="section-title"><h3>Recent timeline</h3><button class="small-btn" data-open="timeline">Open timeline</button></div>${timelineList([...data.events].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4))}`}
function inbox(){return`<div class="card"><h3>Quick capture</h3><textarea id="noteInput" rows="4" placeholder="Capture something now. Sort it later."></textarea><div style="margin-top:10px"><button class="primary-btn" id="saveNoteBtn">Save to Inbox</button></div></div><div class="section-title"><h3>Inbox items</h3></div><div class="list">${data.notes.length?data.notes.map(n=>`<div class="list-item"><div>📝</div><div><div class="item-title">${esc(n.text)}</div><small class="muted">${new Date(n.created).toLocaleString()}</small></div><button class="small-btn" data-note-delete="${esc(n.id)}">Delete</button></div>`).join(""):`<div class="empty">Your Inbox is empty.</div>`}</div>`}
function actions(){
const e=editingTaskId?data.tasks.find(t=>t.id===editingTaskId):null;
return`<div class="card"><h3>${e?"Edit task":"Add a task"}</h3>${e?`<div class="edit-banner"><strong>Editing:</strong> ${esc(e.title)}</div>`:""}<div class="form-grid">
<input id="newTaskInput" class="wide" placeholder="What needs to be done?" value="${e?esc(e.title):""}">
<div><label class="field-label" for="taskArea">Category</label><select id="taskArea">${areaOpts(e?e.area:"")}</select><div class="field-help">Choose General, an existing category, or add a new one.</div></div>
<div><label class="field-label" for="taskPriority">Priority</label><select id="taskPriority"><option value="high" ${e&&e.priority==="high"?"selected":""}>High priority</option><option value="medium" ${!e||e.priority==="medium"?"selected":""}>Medium priority</option><option value="low" ${e&&e.priority==="low"?"selected":""}>Low priority</option></select></div>
<div><label class="field-label" for="taskDue">Due Date</label><input id="taskDue" type="date" value="${e?esc(e.due||""):""}"></div>
<label class="calendar-option"><input id="taskCalendar" type="checkbox"><span><strong>Add to iPhone Calendar</strong><br><small class="muted">${e?"Create a calendar event for this edited task.":"Creates an all-day event on the due date."}</small></span></label>
<div class="button-row wide"><button class="primary-btn" id="addTaskBtn">${e?"Save changes":"Add task"}</button>${e?`<button class="small-btn" id="cancelTaskEdit">Cancel editing</button>`:""}</div>
</div></div><div class="section-title"><h3>Open tasks</h3></div>${taskList(data.tasks.filter(t=>!t.done))}<div class="section-title"><h3>Completed</h3></div>${taskList(data.tasks.filter(t=>t.done))}${atlasHistoryPanel()}`}
const atlasVaultFoldersKey="atlasVaultFolders071";
let atlasVaultFolders=(()=>{try{const x=JSON.parse(localStorage.getItem(atlasVaultFoldersKey)||"[]");return Array.isArray(x)?x:[]}catch{return[]}})();
let atlasVaultFolderFilter="all",atlasVaultSearch="",atlasVaultSort="newest";
function atlasSaveVaultFolders(){localStorage.setItem(atlasVaultFoldersKey,JSON.stringify(atlasVaultFolders))}
function atlasVaultFolderName(id){return atlasVaultFolders.find(f=>f.id===id)?.name||"Unfiled"}
function atlasVaultFolderOptions(selected=""){return `<option value="">Unfiled</option>`+atlasVaultFolders.map(f=>`<option value="${esc(f.id)}" ${f.id===selected?"selected":""}>${esc(f.name)}</option>`).join("")}
function atlasVaultFolderPath(id,seen=new Set()){
  const f=atlasVaultFolders.find(x=>x.id===id);
  if(!f||seen.has(id))return "Unfiled";
  seen.add(id);
  return f.parentId?atlasVaultFolderPath(f.parentId,seen)+" / "+f.name:f.name;
}
function atlasVaultFolderDescendants(id){
  const found=new Set([id]);let previous=-1;
  while(previous!==found.size){previous=found.size;atlasVaultFolders.forEach(f=>{if(found.has(f.parentId))found.add(f.id)})}
  return found;
}
async function atlasVaultEditDoc(id){
  const d=docs.find(x=>x.id===id);if(!d)return;
  const name=prompt("File name",d.name);if(name===null)return;
  if(!name.trim()){alert("File name cannot be empty.");return}
  const tags=prompt("Tags (comma separated)",(d.tags||[]).join(", "));if(tags===null)return;
  const area=prompt("Category",d.area||"General");if(area===null)return;
  await putDoc({...d,name:name.trim(),tags:tags.split(",").map(x=>x.trim()).filter(Boolean),area:area.trim()||"General"});
  await loadDocs();toast("File details saved");
}
async function atlasVaultMoveDoc(id,folderId){
  const d=docs.find(x=>x.id===id);if(!d)return;
  if(folderId&&!atlasVaultFolders.some(f=>f.id===folderId))return;
  await putDoc({...d,folderId:folderId||""});await loadDocs();toast("File moved");
}
function atlasVaultNewFolder(){
  const name=prompt("New folder name");if(name===null)return;
  if(!name.trim())return alert("Folder name is required.");
  const parentId=atlasVaultFolderFilter!=="all"&&atlasVaultFolderFilter!=="unfiled"?atlasVaultFolderFilter:"";
  atlasVaultFolders.push({id:uid("folder"),name:name.trim(),parentId});
  atlasSaveVaultFolders();render();toast("Folder created");
}
function atlasVaultRenameFolder(id){
  const f=atlasVaultFolders.find(x=>x.id===id);if(!f)return;
  const name=prompt("Rename folder",f.name);if(name===null)return;
  if(!name.trim())return alert("Folder name is required.");
  f.name=name.trim();atlasSaveVaultFolders();render();
}
function atlasVaultDeleteFolder(id){
  const f=atlasVaultFolders.find(x=>x.id===id);if(!f)return;
  if(!confirm(`Remove folder "${f.name}"? Files will be moved to Unfiled, not deleted.`))return;
  const descendants=atlasVaultFolderDescendants(id);
  Promise.all(docs.filter(d=>descendants.has(d.folderId)).map(d=>putDoc({...d,folderId:""}))).then(()=>{
    atlasVaultFolders=atlasVaultFolders.filter(f=>!descendants.has(f.id));
    atlasSaveVaultFolders();atlasVaultFolderFilter="all";loadDocs();toast("Folder removed; files preserved");
  }).catch(e=>alert("Folder removal failed: "+e.message));
}

function safeAtlasArgs(args){

// Action history is device-local. Data changes themselves use the existing cloud sync.
const atlasActionHistoryKey="atlasActionHistoryV065";
let atlasActionHistory=(()=>{try{const x=JSON.parse(localStorage.getItem(atlasActionHistoryKey)||"[]");return Array.isArray(x)?x:[]}catch{return[]}})();
function atlasLogAction(name,collection,before,after){
  const entry={id:uid("action"),at:new Date().toISOString(),name,collection,before:before?clone(before):null,after:after?clone(after):null,undone:false};
  atlasActionHistory.unshift(entry);atlasActionHistory=atlasActionHistory.slice(0,60);
  localStorage.setItem(atlasActionHistoryKey,JSON.stringify(atlasActionHistory));
}
function atlasUndoAction(id){
  const e=atlasActionHistory.find(x=>x.id===id);
  if(!e||e.undone)return {ok:false,error:"Action is not available to undo."};
  const list=data[e.collection];if(!Array.isArray(list))return {ok:false,error:"Cannot undo this action."};
  const target=e.after||e.before,index=list.findIndex(x=>x.id===target?.id);
  if(e.after&&(index<0||JSON.stringify(list[index])!==JSON.stringify(e.after)))return {ok:false,error:"Item changed since this action; undo cancelled."};
  if(!e.after&&index>=0)return {ok:false,error:"Item already exists; undo cancelled."};
  if(e.before){if(index>=0)list[index]=clone(e.before);else list.unshift(clone(e.before));}
  else if(index>=0)list.splice(index,1);
  e.undone=true;localStorage.setItem(atlasActionHistoryKey,JSON.stringify(atlasActionHistory));
  save();render();toast("Action undone");
  return {ok:true,action:"undone",undid:e.name,collection:e.collection,item_id:target?.id};
}

}
async function executeAtlasToolImpl(name,args){
  args=safeAtlasArgs(args);
  const clean=v=>String(v??"").trim();
  const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(clean(v))?clean(v):"";
  const priority=v=>["high","medium","low"].includes(clean(v).toLowerCase())?clean(v).toLowerCase():"medium";
  const category=v=>{
    const wanted=clean(v)||"General";
    const existing=allCategories().find(x=>x.toLowerCase()===wanted.toLowerCase());
    if(existing)return existing;
    customCategories.push(wanted);
    localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
    return wanted;
  };

  if(name==="create_task"){
    const title=clean(args.title);if(!title)return {ok:false,error:"Task title is required."};
    const task={id:uid("task"),title,done:false,area:category(args.area),due:validDate(args.due),priority:priority(args.priority)};
    data.tasks.unshift(task);save();toast("Task added: "+task.title);
    return {ok:true,action:"created_task",task};
  }
  if(name==="update_task"){
    const t=data.tasks.find(x=>x.id===clean(args.task_id));
    if(!t)return {ok:false,error:"Task not found. Use search_atlas first to get the task ID."};
    if(args.title!==undefined&&clean(args.title))t.title=clean(args.title);
    if(args.area!==undefined&&clean(args.area))t.area=category(args.area);
    if(args.due!==undefined)t.due=validDate(args.due);
    if(args.priority!==undefined)t.priority=priority(args.priority);
    save();toast("Task updated: "+t.title);
    return {ok:true,action:"updated_task",task:t};
  }
  if(name==="set_task_status"){
    const t=data.tasks.find(x=>x.id===clean(args.task_id));
    if(!t)return {ok:false,error:"Task not found. Use search_atlas first to get the task ID."};
    t.done=!!args.completed;save();toast((t.done?"Completed: ":"Reopened: ")+t.title);
    return {ok:true,action:t.done?"completed_task":"reopened_task",task:t};
  }
  if(name==="create_note"){
    const text=clean(args.text);if(!text)return {ok:false,error:"Note text is required."};
    const note={id:uid("note"),text,created:new Date().toISOString()};
    data.notes.unshift(note);save();toast("Saved to Inbox");
    return {ok:true,action:"created_note",note};
  }
  if(name==="create_timeline_event"){
    const title=clean(args.title),date=validDate(args.date);
    if(!title||!date)return {ok:false,error:"Timeline event needs a title and YYYY-MM-DD date."};
    const event={id:uid("event"),title,date,area:category(args.area),details:clean(args.details)};
    data.events.push(event);save();toast("Timeline event added: "+title);
    return {ok:true,action:"created_timeline_event",event};
  }
  if(name==="create_record"){
    const title=clean(args.title);if(!title)return {ok:false,error:"Record title is required."};
    const tags=Array.isArray(args.tags)?args.tags.map(clean).filter(Boolean):clean(args.tags).split(",").map(x=>x.trim()).filter(Boolean);
    const record={id:uid("record"),title,area:category(args.area),type:clean(args.type)||"General",date:validDate(args.date),tags,details:clean(args.details),created:new Date().toISOString()};
    data.records.unshift(record);save();toast("Record saved: "+title);
    return {ok:true,action:"created_record",record};
  }
  if(name==="create_person"){
    const personName=clean(args.name);if(!personName)return {ok:false,error:"Person name is required."};
    const person={id:uid("person"),name:personName,relationship:clean(args.relationship),notes:clean(args.notes)};
    data.people.push(person);save();toast("Person added: "+personName);
    return {ok:true,action:"created_person",person};
  }
  if(["update_note","update_record","update_person","update_timeline_event"].includes(name)){
    const collection=({update_note:"notes",update_record:"records",update_person:"people",update_timeline_event:"events"})[name];
    const id=clean(args.item_id);
    const item=data[collection].find(x=>x.id===id);
    if(!item)return {ok:false,error:"Item not found. Search ATLAS first to obtain its exact ID."};
    const allowed=({notes:["text"],records:["title","area","type","date","tags","details"],people:["name","relationship","notes"],events:["title","date","area","details"]})[collection];
    let changes=0;
    for(const field of allowed){
      if(args[field]===undefined)continue;
      let value=field==="tags"?(Array.isArray(args.tags)?args.tags.map(clean).filter(Boolean):clean(args.tags).split(",").map(x=>x.trim()).filter(Boolean)):field==="date"?validDate(args.date):field==="area"?category(args.area):clean(args[field]);
      if(["title","name","text"].includes(field)&&!value)return {ok:false,error:field+" cannot be empty."};
      item[field]=value;changes++;
    }
    if(!changes)return {ok:false,error:"No changes specified."};
    save();toast("ATLAS item updated");return {ok:true,action:name,item};
  }
  if(name==="undo_last_action"){
    const latest=atlasActionHistory.find(e=>!e.undone);
    if(!latest)return {ok:false,error:"No recent AI action is available to undo on this device."};
    return atlasUndoAction(latest.id);
  }
  if(name==="search_atlas"){
    const q=clean(args.query).toLowerCase();if(!q)return {ok:false,error:"Search query is required."};
    const scope=clean(args.scope).toLowerCase()||"all";
    const hit=v=>String(v??"").toLowerCase().includes(q);
    const out={query:q,scope};
    if(scope==="all"||scope==="tasks")out.tasks=data.tasks.filter(t=>hit([t.title,t.area,t.priority,t.due].join(" "))).slice(0,25);
    if(scope==="all"||scope==="notes")out.notes=data.notes.filter(n=>hit(n.text)).slice(0,25);
    if(scope==="all"||scope==="events")out.events=data.events.filter(e=>hit([e.title,e.area,e.details,e.date].join(" "))).slice(0,25);
    if(scope==="all"||scope==="records")out.records=data.records.filter(r=>hit([r.title,r.area,r.type,r.details,(r.tags||[]).join(" ")].join(" "))).slice(0,25);
    if(scope==="all"||scope==="people")out.people=data.people.filter(p=>hit([p.name,p.relationship,p.notes].join(" "))).slice(0,25);
    if(scope==="all"||scope==="documents")out.documents=docs.filter(d=>hit([d.name,d.area,(d.tags||[]).join(" ")].join(" "))).slice(0,25).map(d=>({id:d.id,name:d.name,area:d.area,tags:d.tags,type:d.type,created:d.created}));
    return {ok:true,action:"search_results",results:out};
  }
  return {ok:false,error:"Unknown ATLAS action tool: "+name};
}
async function executeAtlasTool(name,args){
  const before=clone(data);
  const result=await executeAtlasToolImpl(name,args);
  if(result?.ok&&name!=="search_atlas"){
    const collection=({create_task:"tasks",update_task:"tasks",set_task_status:"tasks",create_note:"notes",create_record:"records",create_timeline_event:"events",create_person:"people",update_note:"notes",update_record:"records",update_person:"people",update_timeline_event:"events"})[name];
    if(collection){
      const oldItems=before[collection]||[],newItems=data[collection]||[];
      const changed=newItems.find(x=>JSON.stringify(x)!==JSON.stringify(oldItems.find(y=>y.id===x.id)));
      if(changed)atlasLogAction(name,collection,oldItems.find(x=>x.id===changed.id)||null,changed);
    }
  }
  return result;
}
async function handleRealtimeToolCalls(calls){
  if(!Array.isArray(calls)||!calls.length||!atlasVoice.dc)return;
  setVoiceStatus("thinking");
  for(const call of calls){
    let result;
    try{result=await executeAtlasTool(call.name,call.arguments)}
    catch(err){result={ok:false,error:err.message||String(err)}}
    atlasVoice.dc.send(JSON.stringify({
      type:"conversation.item.create",
      item:{type:"function_call_output",call_id:call.call_id,output:JSON.stringify(result)}
    }));
  }
  atlasVoice.dc.send(JSON.stringify({type:"response.create"}));
}
async function handleRealtimeResponseDone(event){
  if(event?.response?.status!=="completed"){
    if(atlasVoice.active)setVoiceStatus("listening");
    return;
  }
  const calls=(event.response.output||[]).filter(x=>x?.type==="function_call"&&x.call_id&&x.name);
  if(calls.length){await handleRealtimeToolCalls(calls);return}
  if(atlasVoice.active)setVoiceStatus("listening");
}

function saveAtlasChat(){
  atlasChat=ensureAtlasMessageIds(atlasChat).slice(-100);
  localStorage.setItem("atlasChatV1",JSON.stringify(atlasChat));
  if(!atlasSyncApplying){
    if(atlasChat.length===0&&atlasLastSavedChat.length)queueAtlasSyncOp({type:"chat_clear"});
    const oldMap=new Map(atlasLastSavedChat.map(m=>[atlasMessageKey(m),m]));
    for(const m of atlasChat){
      const id=atlasMessageKey(m),prev=oldMap.get(id);
      if(!prev||JSON.stringify(prev)!==JSON.stringify(m))queueAtlasSyncOp({type:"chat_upsert",message:clone(m)});
    }
  }
  atlasLastSavedChat=clone(atlasChat);
}

function updateAtlasPrimaryControl(){
  const btn=$("#atlasPrimaryBtn"),box=$("#atlasMessage");
  if(!btn)return;
  const hasPayload=!!((box?.value||"").trim()||atlasPendingAttachments.length);
  btn.classList.toggle("send-mode",hasPayload);
  btn.classList.toggle("voice-mode",!hasPayload);
  btn.classList.toggle("voice-active",!hasPayload&&!!atlasVoice.active);
  btn.classList.toggle("voice-speaking",!hasPayload&&atlasVoice.status==="speaking");
  btn.innerHTML=hasPayload?atlasSendIcon():atlasVoiceButtonIcon(atlasVoice.active);
  btn.disabled=!!atlasSending||(!hasPayload&&!!atlasVoice.connecting);
  const label=hasPayload?"Send message":atlasVoice.active?"End live voice":"Start live voice";
  btn.setAttribute("aria-label",label);btn.title=hasPayload?"Send":label;
}
function setVoiceStatus(status){
  atlasVoice.status=status;
  const muteBtn=$("#atlasMuteBtn");
  if(muteBtn){
    muteBtn.innerHTML=atlasMicButtonIcon(atlasVoice.muted);
    muteBtn.disabled=!atlasVoice.active||atlasVoice.connecting;
    muteBtn.classList.toggle("muted-active",!!atlasVoice.muted);
    muteBtn.setAttribute("aria-pressed",atlasVoice.muted?"true":"false");
    muteBtn.setAttribute("aria-label",atlasVoice.muted?"Unmute microphone":"Mute microphone");
    muteBtn.title=atlasVoice.muted?"Unmute microphone":"Mute microphone";
  }
  updateAtlasPrimaryControl();
}
function appendAtlasTranscript(role,content){
  content=String(content||"").trim();if(!content)return;
  const last=atlasChat[atlasChat.length-1];
  if(last&&last.role===role&&last.content===content&&Date.now()-new Date(last.at||0).getTime()<5000)return;
  atlasChat.push({role,content,at:new Date().toISOString(),source:"voice"});
  saveAtlasChat();
  const w=$("#atlasChatWindow");
  if(w){
    const empty=w.querySelector(".chat-empty");if(empty)empty.remove();
    const row=document.createElement("div");row.className=`chat-msg ${role==="user"?"user":"assistant"}`;
    row.innerHTML=`<div class="chat-bubble"><div class="chat-role">${role==="user"?"You":"ATLAS"}</div>${esc(content)}</div>`;
    w.appendChild(row);w.scrollTop=w.scrollHeight;
  }
}
function cleanupAtlasVoice(){
  try{atlasVoice.dc?.close()}catch{}
  try{atlasVoice.pc?.close()}catch{}
  try{atlasVoice.stream?.getTracks().forEach(t=>t.stop())}catch{}
  try{if(atlasVoice.audio){atlasVoice.audio.pause();atlasVoice.audio.srcObject=null}}catch{}
  atlasVoice.pc=null;atlasVoice.dc=null;atlasVoice.stream=null;atlasVoice.audio=null;atlasVoice.sender=null;
  atlasVoice.active=false;atlasVoice.connecting=false;atlasVoice.muted=false;atlasVoice.status="idle";atlasVoice.responseActive=false;
  if(currentPage==="atlas")render();
}
function atlasVoiceControlIntent(text){
  let v=String(text||"").toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
  v=v.replace(/^(?:um|uh|erm|hmm|hey|okay|ok)\s+/,"");

  // End the live session. Keep this fairly strict so normal sentences about saying goodbye do not end ATLAS.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:good\s*bye|bye|end(?: the)? voice|stop(?: the)? voice|end(?: the)? session)(?:\s+atlas)?$/.test(v))return "end";

  // Mute/pause listening. Accept both direct commands and natural requests such as
  // “are you able to mute?”, “can you pause listening?”, or “stop listening please”.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:mute|pause|mute listening|pause listening|stop listening|stop hearing me)(?:\s+(?:please|atlas))?$/.test(v))return "mute";
  if(/^(?:atlas\s+)?(?:are you able to|can you|could you|would you|will you|would you please|could you please|can you please)\s+(?:mute|pause|mute listening|pause listening|stop listening|stop hearing me)(?:\s+(?:please|atlas))?$/.test(v))return "mute";
  if(/^(?:atlas\s+)?(?:please\s+)?(?:mute|pause)\s+(?:yourself|the mic|the microphone|your mic|your microphone|listening)(?:\s+(?:please|atlas))?$/.test(v))return "mute";

  // Resume listening. These are mainly useful when typed because a truly muted microphone cannot hear a voice command.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:unmute|listen|resume|resume listening|start listening|listen again|start listening again)(?:\s+(?:please|atlas))?$/.test(v))return "unmute";
  if(/^(?:atlas\s+)?(?:can you|could you|would you|will you)\s+(?:unmute|listen|resume listening|start listening|listen again)(?:\s+(?:please|atlas))?$/.test(v))return "unmute";
  return "";
}
function cancelAtlasVoiceResponse(){
  if(!atlasVoice.responseActive||!atlasVoice.dc||atlasVoice.dc.readyState!=="open")return;
  try{atlasVoice.dc.send(JSON.stringify({type:"response.cancel"}))}catch{}
  try{atlasVoice.dc.send(JSON.stringify({type:"output_audio_buffer.clear"}))}catch{}
  atlasVoice.responseActive=false;
}
async function setAtlasListening(shouldListen,{cancelResponse=false,quiet=false}={}){
  if(!atlasVoice.active||!atlasVoice.sender)return false;
  if(shouldListen&&!atlasVoice.muted){if(!quiet)toast("ATLAS is already listening");return true}
  if(!shouldListen&&atlasVoice.muted){if(!quiet)toast("ATLAS microphone is already paused");return true}

  if(!shouldListen){
    if(cancelResponse)cancelAtlasVoiceResponse();

    // Hard-stop microphone capture FIRST. This is the primary mute and is deliberately
    // independent of replaceTrack(null), which can behave inconsistently on mobile Safari.
    try{
      const senderTrack=atlasVoice.sender.track;
      if(senderTrack)senderTrack.enabled=false;
    }catch{}
    try{
      atlasVoice.stream?.getAudioTracks().forEach(track=>{
        try{track.enabled=false}catch{}
        try{track.stop()}catch{}
      });
    }catch{}

    // Clear any audio already queued for the Realtime session, then detach the ended track.
    try{
      if(atlasVoice.dc?.readyState==="open"){
        atlasVoice.dc.send(JSON.stringify({type:"input_audio_buffer.clear"}));
      }
    }catch{}
    try{await atlasVoice.sender.replaceTrack(null)}catch(err){console.warn("ATLAS replaceTrack(null) fallback:",err)}

    atlasVoice.stream=null;
    atlasVoice.muted=true;
    setVoiceStatus("paused");
    if(!quiet)toast("ATLAS paused • microphone capture stopped");
    return true;
  }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const track=stream.getAudioTracks()[0];
    if(!track)throw new Error("No microphone track was available.");
    track.enabled=true;
    await atlasVoice.sender.replaceTrack(track);
    atlasVoice.stream=stream;
    atlasVoice.muted=false;
    setVoiceStatus("listening");
    if(!quiet)toast("ATLAS is listening again");
    return true;
  }catch(err){
    console.error(err);
    toast("Microphone resume failed: "+(err.message||err));
    return false;
  }
}
async function endAtlasVoice(){
  cancelAtlasVoiceResponse();
  cleanupAtlasVoice();
  toast("Voice session ended");
}
async function runLocalVoiceControl(intent,{source="typed"}={}){
  if(intent==="end"){
    if(atlasVoice.active||atlasVoice.connecting){await endAtlasVoice();return "Voice session ended."}
    return "Voice is already off.";
  }
  if(intent==="mute"){
    if(!atlasVoice.active)return "Voice is not currently running.";
    const ok=await setAtlasListening(false,{cancelResponse:source==="spoken"});
    return ok?"Listening paused. Microphone capture is stopped.":"I could not pause the microphone.";
  }
  if(intent==="unmute"){
    if(atlasVoice.active){
      const ok=await setAtlasListening(true);
      return ok?"Listening resumed.":"I could not resume the microphone.";
    }
    await startAtlasVoice();
    return "Starting live voice.";
  }
  return "";
}
function handleRealtimeEvent(event){
  if(!event||!event.type)return;
  if(event.type==="input_audio_buffer.speech_started"){if(!atlasVoice.muted)setVoiceStatus("listening");return}
  if(event.type==="input_audio_buffer.speech_stopped"){if(!atlasVoice.muted)setVoiceStatus("thinking");return}
  if(event.type==="response.created"){atlasVoice.responseActive=true;if(!atlasVoice.muted)setVoiceStatus("thinking");return}
  if(event.type==="response.output_audio_transcript.delta"||event.type==="response.output_audio.delta"){if(!atlasVoice.muted)setVoiceStatus("speaking");return}
  if(event.type==="response.output_audio_transcript.done"){appendAtlasTranscript("assistant",event.transcript);return}
  if(event.type==="conversation.item.input_audio_transcription.completed"){
    appendAtlasTranscript("user",event.transcript);
    const intent=atlasVoiceControlIntent(event.transcript);
    if(intent){runLocalVoiceControl(intent,{source:"spoken"});return}
    return;
  }
  if(event.type==="response.done"){atlasVoice.responseActive=false;handleRealtimeResponseDone(event);return}
  if(event.type==="response.output_audio.done"){return}
  if(event.type==="error"){console.error("ATLAS realtime error",event);toast(event.error?.message||"ATLAS voice error");return}
}
async function startAtlasVoice(){
  if(atlasVoice.active||atlasVoice.connecting)return;
  const password=brainPassword();if(!password){toast("Unlock ATLAS first");return}
  const selected=$("#atlasVoiceSelect")?.value||atlasVoice.voice||"cedar";
  atlasVoice.voice=selected;localStorage.setItem("atlasVoiceName",selected);
  atlasVoice.connecting=true;setVoiceStatus("connecting");
  try{
    const tokenRes=await fetch(ATLAS_REALTIME_URL,{method:"POST",headers:{"Content-Type":"application/json","X-Atlas-Password":password},body:JSON.stringify({voice:selected,client_now:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||""})});
    const tokenBody=await tokenRes.json().catch(()=>({}));
    if(tokenRes.status===401){localStorage.removeItem("atlasBrainPassword");throw new Error("Your ATLAS access password was rejected.")}
    if(!tokenRes.ok||!tokenBody.value)throw new Error(tokenBody.detail||tokenBody.error||`Voice token request failed (${tokenRes.status}).`);

    const pc=new RTCPeerConnection();
    const audio=new Audio();audio.autoplay=true;audio.playsInline=true;
    pc.ontrack=e=>{audio.srcObject=e.streams[0];audio.play().catch(()=>{})};

    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const micTrack=stream.getAudioTracks()[0];
    if(!micTrack)throw new Error("No microphone track was available.");
    const sender=pc.addTrack(micTrack,stream);

    const dc=pc.createDataChannel("oai-events");
    dc.addEventListener("message",e=>{try{handleRealtimeEvent(JSON.parse(e.data))}catch(err){console.error(err)}});
    dc.addEventListener("open",()=>{atlasVoice.active=true;atlasVoice.connecting=false;setVoiceStatus("listening");toast("ATLAS voice connected")});
    dc.addEventListener("close",()=>{if(atlasVoice.active)cleanupAtlasVoice()});

    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdpRes=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",body:pc.localDescription.sdp,headers:{Authorization:`Bearer ${tokenBody.value}`,"Content-Type":"application/sdp"}});
    if(!sdpRes.ok)throw new Error(`Realtime connection failed (${sdpRes.status}): ${await sdpRes.text()}`);
    await pc.setRemoteDescription({type:"answer",sdp:await sdpRes.text()});

    atlasVoice.pc=pc;atlasVoice.dc=dc;atlasVoice.stream=stream;atlasVoice.audio=audio;atlasVoice.sender=sender;atlasVoice.muted=false;atlasVoice.responseActive=false;
  }catch(err){
    console.error(err);
    cleanupAtlasVoice();
    alert(`ATLAS Voice could not start:\n\n${err.message}`);
  }
}
async function toggleAtlasMute(){
  if(!atlasVoice.active)return;
  await setAtlasListening(atlasVoice.muted);
}
function atlasAttachmentMeta(doc){
  return {id:doc.id,name:doc.name,type:doc.type||"application/octet-stream",size:doc.size||0,area:doc.area||"General",created:doc.created||new Date().toISOString()};
}
function addPendingAtlasAttachment(doc){
  if(!doc||!doc.id)return;
  if(!atlasPendingAttachments.some(a=>a.id===doc.id))atlasPendingAttachments.push(atlasAttachmentMeta(doc));
}
async function storeAndAttachAtlasFiles(fileList,source="files"){
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  for(const f of files){
    const fallback=source==="camera"?"ATLAS Photo "+new Date().toLocaleString():f.name||"ATLAS attachment";
    const doc={id:uid("doc"),name:f.name||fallback,type:f.type||"application/octet-stream",size:f.size||0,created:new Date().toISOString(),tags:[],area:"General",blob:f};
    await putDoc(doc);
    docs=docs.filter(d=>d.id!==doc.id);
    docs.unshift(doc);
    addPendingAtlasAttachment(doc);
  }
  render();
  toast(files.length===1?"Attachment added":"Attachments added");
}

async function sendAtlasMessage(){
  if(atlasSending)return;
  const box=$("#atlasMessage");
  const typed=(box?.value||"").trim();
  const attachments=atlasPendingAttachments.map(a=>({...a}));
  if(!typed&&!attachments.length)return;

  const controlIntent=atlasVoiceControlIntent(typed);
  if(controlIntent&&!attachments.length){
    atlasChat.push({role:"user",content:typed,at:new Date().toISOString(),source:"control"});
    const result=await runLocalVoiceControl(controlIntent,{source:"typed"});
    atlasChat.push({role:"assistant",content:result,at:new Date().toISOString(),source:"control"});
    saveAtlasChat();render();
    return;
  }

  const password=brainPassword();
  if(!password)return;
  const history=atlasChat.slice(-12).map(m=>({role:m.role,content:m.content}));
  const displayMessage=typed||`Attached ${attachments.length===1?attachments[0].name:attachments.length+" files"}`;
  const attachmentNote=attachments.length
    ? `\n\nATLAS attachment metadata (the file bytes are stored locally in the ATLAS Library; this version cannot yet inspect the file contents):\n${attachments.map(a=>`- ${a.name} | ${a.type||"file"} | ${a.area||"General"}`).join("\n")}`
    : "";
  const apiMessage=typed+attachmentNote;

  atlasChat.push({role:"user",content:displayMessage,attachments,at:new Date().toISOString()});
  atlasPendingAttachments=[];
  saveAtlasChat();atlasSending=true;render();

  const callApi=async payload=>{
    const res=await fetch(ATLAS_API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Atlas-Password":password},
      body:JSON.stringify(payload)
    });
    const body=await res.json().catch(()=>({}));
    if(res.status===401){
      localStorage.removeItem("atlasBrainPassword");
      throw new Error("That ATLAS access password was rejected. Please unlock ATLAS again.");
    }
    if(!res.ok)throw new Error(body.detail||body.error||("ATLAS server returned "+res.status+"."));
    return body;
  };

  try{
    let body=await callApi({message:apiMessage,history,client_context:atlasClientContext()});
    let rounds=0;
    const seenActionCalls=new Set();
    while(Array.isArray(body.action_calls)&&body.action_calls.length&&rounds<5){
      const tool_results=[];
      for(const call of body.action_calls){
        let result;
        const signature=JSON.stringify([call.name,safeAtlasArgs(call.arguments)]);
        if(seenActionCalls.has(signature)){
          result={ok:false,error:"This action was already attempted in this request. Stop and report the prior result."};
        }else{
          seenActionCalls.add(signature);
          try{result=await executeAtlasTool(call.name,call.arguments)}
          catch(err){result={ok:false,error:err.message||String(err)}}
        }
        tool_results.push({call_id:call.call_id||"",name:call.name,result});
      }
      rounds++;
      body=await callApi({message:apiMessage,history,client_context:atlasClientContext(),tool_results,action_round:rounds});
    }
    if(Array.isArray(body.action_calls)&&body.action_calls.length){
      throw new Error("ATLAS stopped an unusually long action chain for safety. Please try the request again more specifically.");
    }
    atlasChat.push({role:"assistant",content:body.reply||"The ATLAS action completed.",at:new Date().toISOString()});
    saveAtlasChat();
  }catch(err){
    atlasChat.push({role:"assistant",content:"Connection error: "+err.message,at:new Date().toISOString()});
    saveAtlasChat();
  }finally{
    atlasSending=false;render();
    setTimeout(()=>{const w=$("#atlasChatWindow");if(w)w.scrollTop=w.scrollHeight},40);
  }
}

function searchResults(q){q=q.toLowerCase().trim();if(!q)return dashboard();const th=data.tasks.filter(t=>(`${t.title} ${t.area} ${t.priority}`).toLowerCase().includes(q)),nh=data.notes.filter(n=>String(n.text||"").toLowerCase().includes(q)),rh=data.records.filter(r=>(`${r.title} ${r.area} ${r.type} ${r.details} ${(r.tags||[]).join(" ")}`).toLowerCase().includes(q)),dh=docs.filter(d=>(`${d.name} ${d.area} ${(d.tags||[]).join(" ")}`).toLowerCase().includes(q)),eh=data.events.filter(e=>(`${e.title} ${e.area} ${e.details}`).toLowerCase().includes(q)),ph=data.people.filter(p=>(`${p.name} ${p.relationship} ${p.notes}`).toLowerCase().includes(q));return`<div class="section-title"><h3>Search results for “${esc(q)}”</h3></div><div class="grid cols-3"><div class="card"><h3>Tasks</h3>${th.length?th.map(t=>`<p>${esc(t.title)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Records</h3>${rh.length?rh.map(r=>`<p>${esc(r.title)} <span class="pill">${esc(r.area)}</span></p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Documents</h3>${dh.length?dh.map(d=>`<p>${esc(d.name)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Timeline</h3>${eh.length?eh.map(e=>`<p>${esc(fmt(e.date))} — ${esc(e.title)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Inbox</h3>${nh.length?nh.map(n=>`<p>${esc(n.text)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>People</h3>${ph.length?ph.map(p=>`<p>${esc(p.name)} — ${esc(p.relationship)}</p>`).join(""):`<p class="muted">No matches</p>`}</div></div>`}
function render(){const tm={home:"Command Center",atlas:"ATLAS Brain",inbox:"Inbox",actions:"Action Center",library:"Document Library",timeline:"Timeline",people:"People",settings:"Settings"};pageTitle.textContent=tm[currentPage]||currentPage[0].toUpperCase()+currentPage.slice(1);const hero=document.querySelector(".hero");if(hero)hero.style.display=currentPage==="atlas"?"none":"grid";content.innerHTML=currentPage==="home"?dashboard():currentPage==="atlas"?atlasChatPage():currentPage==="inbox"?inbox():currentPage==="actions"?actions():currentPage==="library"?library():currentPage==="timeline"?timeline():currentPage==="people"?people():currentPage==="settings"?settings():sectionPage(currentPage);bind();if(currentPage==="atlas")setTimeout(()=>{const w=$("#atlasChatWindow");if(w)w.scrollTop=w.scrollHeight;setVoiceStatus(atlasVoice.status)},20)}

function wireTaskCategory(){
  const s=$("#taskArea");
  if(!s)return;
  s.onchange=()=>{
    if(s.value!=="__new__")return;
    const name=(prompt("Name your new category:","")||"").trim();
    if(!name){s.value="";return}
    if(!allCategories().some(x=>x.toLowerCase()===name.toLowerCase())){
      customCategories.push(name);
      localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
      queueAtlasSyncOp({type:"category_add",name});
    }
    s.innerHTML=areaOpts(name);
    s.value=name;
  };
}
function icsDate(d){return d.replaceAll("-","")}
function icsNextDate(d){
  const [y,m,day]=d.split("-").map(Number),x=new Date(y,m-1,day+1);
  return `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`;
}
function icsEsc(s=""){return String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
function addToIPhoneCalendar(task){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ATLAS//Task//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${task.id}@atlas`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${icsDate(task.due)}`,`DTEND;VALUE=DATE:${icsNextDate(task.due)}`,
    `SUMMARY:${icsEsc(task.title)}`,`DESCRIPTION:${icsEsc(`ATLAS task\nCategory: ${task.area}\nPriority: ${task.priority}`)}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`ATLAS-${task.title.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").slice(0,40)||"task"}.ics`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast("Calendar event created — open the .ics file and tap Add.");
}

 document.querySelectorAll("[data-atlas-undo]").forEach(b=>b.onclick=()=>{if(confirm("Undo this AI action?")){const r=atlasUndoAction(b.dataset.atlasUndo);if(!r.ok)toast(r.error)}});
