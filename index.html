<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<title>ATLAS 0.2 Command Center</title>
<style>
:root{--bg:#07111c;--panel:#0d1b2a;--panel2:#122337;--text:#eef4fb;--muted:#9fb0c2;--gold:#d6b66b;--gold2:#f1d78e;--line:rgba(255,255,255,.08);--shadow:0 18px 50px rgba(0,0,0,.28);--ok:#5fc58a;--danger:#e46d6d}
:root.light{--bg:#eef2f7;--panel:#fff;--panel2:#f6f8fb;--text:#132235;--muted:#66788d;--gold:#9a7625;--gold2:#c49a3c;--line:rgba(19,34,53,.10);--shadow:0 18px 50px rgba(34,55,80,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:286px;background:linear-gradient(180deg,var(--panel),#091522);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:13px;align-items:center;padding:4px 6px 22px}.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#112033;font-weight:900;font-size:24px;box-shadow:var(--shadow)}.brand h1{margin:0;font-size:22px;letter-spacing:.18em}.brand p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.35;max-width:180px}.version{display:inline-block;margin-top:4px;color:var(--gold);font-size:10px}.nav-list{display:grid;gap:6px}.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left}.nav-item:hover,.nav-item.active{background:rgba(214,182,107,.12);color:var(--gold2)}.nav-icon{width:26px;text-align:center}.sidebar-footer{margin-top:auto;display:grid;gap:8px}
.ghost-btn,.file-label{border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:center}.main{margin-left:286px;min-height:100vh;padding:20px 26px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:rgba(7,17,28,.88);backdrop-filter:blur(18px);padding:10px 0 18px;z-index:10}.light .topbar{background:rgba(238,242,247,.88)}.topbar h2{margin:3px 0 0;font-size:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold)}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:12px}.hero{display:grid;gap:12px;margin-bottom:22px}.search-wrap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 16px;box-shadow:var(--shadow)}.search-wrap input{width:100%;padding:15px 0;border:0;outline:0;background:transparent;color:var(--text)}.voice-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid rgba(214,182,107,.25);padding:14px;border-radius:18px}.mic-btn{width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 0 rgba(214,182,107,.35);font-size:24px}.mic-btn.listening{animation:pulse 1.15s infinite}@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(214,182,107,0)}100%{box-shadow:0 0 0 0 rgba(214,182,107,0)}}.voice-title{font-weight:800}.voice-status{color:var(--muted);font-size:13px;margin-top:4px}.primary-btn{border:0;border-radius:12px;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px}.danger-btn{border:1px solid rgba(228,109,109,.35);background:transparent;color:var(--danger);border-radius:10px;padding:8px 10px}textarea{resize:vertical;min-height:60px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;outline:0}
.grid{display:grid;gap:14px}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 10px;font-size:16px}.card .big{font-size:30px;font-weight:900;color:var(--gold2)}.muted{color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h3{margin:0}.quick-card{display:flex;gap:13px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:16px}.quick-icon{font-size:26px}.list{display:grid;gap:9px}.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}.list-item.done .item-title{text-decoration:line-through;opacity:.6}.check{width:20px;height:20px}.small-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px}.form-row{display:grid;grid-template-columns:1fr auto;gap:8px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .wide{grid-column:1/-1}.form-grid input,.form-grid select,.form-row input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);margin:2px}.mobile-nav{display:none}.mobile-only{display:none}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#111d2b;color:#fff;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.doc-preview{width:54px;height:54px;border-radius:10px;background:var(--panel);display:grid;place-items:center;overflow:hidden}.doc-preview img{width:100%;height:100%;object-fit:cover}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}.timeline-item{position:relative;margin-bottom:14px}.timeline-item:before{content:"";position:absolute;left:-17px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--gold)}.badge-ok{color:var(--ok)}.upload-zone{border:1px dashed rgba(214,182,107,.45);border-radius:16px;padding:18px;text-align:center;background:rgba(214,182,107,.05)}.upload-zone input{display:none}.upload-label{display:inline-block;background:var(--gold);color:#101b28;font-weight:800;padding:11px 16px;border-radius:12px}
@media(max-width:1050px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:12px 14px 96px}.mobile-only{display:inline-grid;place-items:center}.topbar h2{font-size:23px}.grid.cols-4,.grid.cols-3,.grid.cols-2,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(13,27,42,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}.mobile-nav .nav-item{display:grid;place-items:center;gap:2px;padding:5px 2px;font-size:10px}.mobile-nav .nav-icon{font-size:18px}.voice-card{grid-template-columns:auto 1fr}.voice-card .primary-btn{grid-column:1/-1}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="brand-mark">A</div><div><h1>ATLAS</h1><p>Advanced Tracking, Library & Archival System</p><span class="version">Standalone 0.2</span></div></div>
<nav id="desktopNav" class="nav-list"></nav>
<div class="sidebar-footer"><button class="ghost-btn" id="exportBtn">Export metadata</button><label class="ghost-btn file-label">Import metadata<input id="importInput" type="file" accept="application/json" hidden></label></div>
</aside>
<main class="main">
<header class="topbar"><button class="icon-btn mobile-only" id="menuBtn">☰</button><div><div class="eyebrow" id="greeting"></div><h2 id="pageTitle">Command Center</h2></div><button class="icon-btn" id="themeBtn">◐</button></header>
<section class="hero">
<div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Search tasks, notes, documents, people and events…" autocomplete="off"></div>
<div class="voice-card"><button id="micBtn" class="mic-btn">🎤</button><div><div class="voice-title">Talk to ATLAS</div><div id="voiceStatus" class="voice-status">Tap the microphone, then speak a command.</div></div><button id="runCommandBtn" class="primary-btn">Run</button></div>
<textarea id="commandInput" rows="2" placeholder='Try: “Atlas, add an event for the BMW accident on May 3”'></textarea>
</section>
<section id="content"></section>
</main>
<nav id="mobileNav" class="mobile-nav"></nav>
<div id="toast" class="toast"></div>
<script>
const NAV=[["home","⌂","Home"],["inbox","✉","Inbox"],["actions","✓","Action Center"],["library","🗂","Library"],["timeline","◷","Timeline"],["medical","✚","Medical"],["legal","⚖","Legal"],["housing","⌂","Housing"],["finance","$","Finance"],["vehicles","🚗","Vehicles"],["pets","🐈","Pets"],["people","👥","People"],["knowledge","📚","Knowledge"],["settings","⚙","Settings"]];
const defaultData={tasks:[{id:Date.now()+"a",title:"Follow up on BMW claim",done:false,area:"Legal"},{id:Date.now()+"b",title:"Review LADWP payment arrangement",done:false,area:"Housing"},{id:Date.now()+"c",title:"Track kitten vaccinations",done:false,area:"Pets"}],notes:[],events:[{id:Date.now()+"e",date:"2026-05-03",title:"BMW collision",area:"Vehicles",details:"Rear driver-side collision; vehicle became undrivable."}],people:[{id:Date.now()+"p1",name:"Luis",relationship:"Partner",notes:"Household member"},{id:Date.now()+"p2",name:"Gerardo Zaldivar",relationship:"LACDA caseworker",notes:"Housing contact"}],sections:{medical:["Providers","Medications","Lab results","Procedures","Insurance"],legal:["Active matters","Evidence","Correspondence","Deadlines","Contacts"],housing:["Lease","LACDA","Utilities","Repairs","Inspections"],finance:["Banking","Bills","Benefits","Receipts","Taxes"],vehicles:["BMW","E-bikes","Scooter","Insurance","Maintenance"],pets:["Profiles","Vaccinations","Vet records","Photos","Medications"],knowledge:["Reference notes","Research","How-to guides","Important records"]}};
let data=JSON.parse(localStorage.getItem("atlasDataV2")||"null")||defaultData,currentPage="home",docs=[];
const $=s=>document.querySelector(s),content=$("#content"),pageTitle=$("#pageTitle"),commandInput=$("#commandInput"),micBtn=$("#micBtn"),voiceStatus=$("#voiceStatus");
function save(){localStorage.setItem("atlasDataV2",JSON.stringify(data))}function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("atlasFiles",1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("documents"))db.createObjectStore("documents",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadDocs(){try{const db=await openDB();docs=await new Promise((res,rej)=>{const r=db.transaction("documents").objectStore("documents").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});if(currentPage==="library"||currentPage==="home")render()}catch(e){console.error(e)}}
async function putDoc(doc){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction("documents","readwrite").objectStore("documents").put(doc);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function deleteDoc(id){const db=await openDB();await new Promise((res,rej)=>{const r=db.transaction("documents","readwrite").objectStore("documents").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});await loadDocs();toast("Document deleted")}
function renderNav(){const make=i=>i.map(([id,ic,l])=>`<button class="nav-item ${currentPage===id?"active":""}" data-page="${id}"><span class="nav-icon">${ic}</span><span>${l}</span></button>`).join("");$("#desktopNav").innerHTML=make(NAV);$("#mobileNav").innerHTML=make(NAV.slice(0,5));document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){currentPage=p;$("#sidebar").classList.remove("open");renderNav();render()}
function greet(){const h=new Date().getHours();$("#greeting").textContent=h<12?"Good morning":h<18?"Good afternoon":"Good evening"}
function taskList(ts){if(!ts.length)return`<div class="empty">Nothing here yet.</div>`;return`<div class="list">${ts.map(t=>`<div class="list-item ${t.done?"done":""}"><input class="check" type="checkbox" ${t.done?"checked":""} data-task-toggle="${t.id}"><div><div class="item-title">${esc(t.title)}</div><span class="pill">${esc(t.area||"General")}</span></div><button class="small-btn" data-task-delete="${t.id}">Delete</button></div>`).join("")}</div>`}
function dashboard(){return`<div class="grid cols-4"><div class="card"><h3>Open tasks</h3><div class="big">${data.tasks.filter(t=>!t.done).length}</div><div class="muted">Across ATLAS</div></div><div class="card"><h3>Inbox</h3><div class="big">${data.notes.length}</div><div class="muted">Notes and captures</div></div><div class="card"><h3>Documents</h3><div class="big">${docs.length}</div><div class="muted">Stored on this device</div></div><div class="card"><h3>Timeline events</h3><div class="big">${data.events.length}</div><div class="muted">Chronological records</div></div></div><div class="section-title"><h3>Quick access</h3></div><div class="grid cols-4">${NAV.slice(3,13).map(([id,ic,l])=>`<button class="quick-card" data-open="${id}"><span class="quick-icon">${ic}</span><span><strong>${l}</strong><br><small class="muted">Open workspace</small></span></button>`).join("")}</div><div class="section-title"><h3>Today’s priorities</h3><button class="small-btn" data-open="actions">View all</button></div>${taskList(data.tasks.slice(0,5))}`}
function inbox(){return`<div class="card"><h3>Quick capture</h3><textarea id="noteInput" rows="4" placeholder="Capture something to process later."></textarea><div style="margin-top:10px"><button class="primary-btn" id="saveNoteBtn">Save to Inbox</button></div></div><div class="section-title"><h3>Inbox items</h3></div><div class="list">${data.notes.length?data.notes.map(n=>`<div class="list-item"><div>📝</div><div><div class="item-title">${esc(n.text)}</div><small class="muted">${new Date(n.created).toLocaleString()}</small></div><button class="small-btn" data-note-delete="${n.id}">Delete</button></div>`).join(""):`<div class="empty">Your Inbox is empty.</div>`}</div>`}
function actions(){return`<div class="card"><h3>Add a task</h3><div class="form-grid"><input id="newTaskInput" class="wide" placeholder="What needs to be done?"><select id="taskArea"><option>General</option><option>Medical</option><option>Legal</option><option>Housing</option><option>Finance</option><option>Vehicles</option><option>Pets</option></select><button class="primary-btn" id="addTaskBtn">Add task</button></div></div><div class="section-title"><h3>All tasks</h3></div>${taskList(data.tasks)}`}
function library(){return`<div class="upload-zone"><h3>Add documents or photos</h3><p class="muted">Files stay in this browser’s local IndexedDB storage.</p><label class="upload-label">Choose files<input id="docInput" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.rtf" capture="environment"></label></div><div class="section-title"><h3>Document library</h3><span class="pill">${docs.length} items</span></div>${docs.length?`<div class="list">${docs.sort((a,b)=>b.created.localeCompare(a.created)).map(d=>`<div class="list-item"><div class="doc-preview">${d.type.startsWith("image/")?`<img src="${URL.createObjectURL(d.blob)}">`:"📄"}</div><div><div class="item-title">${esc(d.name)}</div><small class="muted">${esc(d.area)} • ${new Date(d.created).toLocaleString()} • ${Math.round(d.size/1024)} KB</small><div>${(d.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div></div><div><button class="small-btn" data-doc-open="${d.id}">Open</button> <button class="danger-btn" data-doc-delete="${d.id}">Delete</button></div></div>`).join("")}</div>`:`<div class="empty">No documents added yet.</div>`}`}
function timeline(){const ev=[...data.events].sort((a,b)=>b.date.localeCompare(a.date));return`<div class="card"><h3>Add timeline event</h3><div class="form-grid"><input id="eventTitle" placeholder="Event title"><input id="eventDate" type="date"><select id="eventArea"><option>General</option><option>Medical</option><option>Legal</option><option>Housing</option><option>Finance</option><option>Vehicles</option><option>Pets</option></select><input id="eventDetails" placeholder="Details"><button class="primary-btn wide" id="addEventBtn">Add event</button></div></div><div class="section-title"><h3>Timeline</h3></div><div class="card timeline">${ev.length?ev.map(e=>`<div class="timeline-item"><strong>${esc(e.title)}</strong><div class="muted">${esc(e.date)} • ${esc(e.area)}</div><div>${esc(e.details||"")}</div><button class="small-btn" data-event-delete="${e.id}">Delete</button></div>`).join(""):`<div class="empty">No events yet.</div>`}</div>`}
function people(){return`<div class="card"><h3>Add person</h3><div class="form-grid"><input id="personName" placeholder="Name"><input id="personRelationship" placeholder="Relationship or role"><input class="wide" id="personNotes" placeholder="Notes"><button class="primary-btn wide" id="addPersonBtn">Add person</button></div></div><div class="section-title"><h3>People</h3></div><div class="grid cols-3">${data.people.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><span class="pill">${esc(p.relationship)}</span><p class="muted">${esc(p.notes||"")}</p><button class="small-btn" data-person-delete="${p.id}">Delete</button></div>`).join("")}</div>`}
function sectionPage(p){const labels=data.sections[p]||[];return`<div class="grid cols-3">${labels.map((x,i)=>`<div class="card"><h3>${esc(x)}</h3><div class="muted">${i===0?"Ready for records and notes.":"No items added yet."}</div></div>`).join("")}</div><div class="section-title"><h3>Related tasks</h3></div>${taskList(data.tasks.filter(t=>(t.area||"").toLowerCase()===p))}<div class="section-title"><h3>Related documents</h3></div>${docs.filter(d=>(d.area||"").toLowerCase()===p).length?`<div class="list">${docs.filter(d=>(d.area||"").toLowerCase()===p).map(d=>`<div class="list-item"><div>📄</div><div>${esc(d.name)}</div><button class="small-btn" data-doc-open="${d.id}">Open</button></div>`).join("")}</div>`:`<div class="empty">No related documents yet.</div>`}`}
function settings(){return`<div class="grid cols-2"><div class="card"><h3>Storage</h3><p class="muted">Metadata uses localStorage. Uploaded file data uses IndexedDB on this device.</p><button class="danger-btn" id="clearDataBtn">Reset metadata</button></div><div class="card"><h3>Voice commands</h3><p class="muted">Tap the microphone and grant permission. Typed commands always work.</p></div><div class="card"><h3>Privacy</h3><p class="muted badge-ok">No ATLAS content is transmitted to a server by this build.</p></div><div class="card"><h3>AI status</h3><p class="muted">The interface is ready for a future secure ChatGPT connection, but this local-only build does not include an API key or cloud AI service.</p></div></div>`}
function searchResults(q){q=q.toLowerCase().trim();if(!q)return dashboard();const th=data.tasks.filter(t=>(t.title+" "+t.area).toLowerCase().includes(q)),nh=data.notes.filter(n=>n.text.toLowerCase().includes(q)),dh=docs.filter(d=>(d.name+" "+d.area+" "+(d.tags||[]).join(" ")).toLowerCase().includes(q)),eh=data.events.filter(e=>(e.title+" "+e.area+" "+e.details).toLowerCase().includes(q)),ph=data.people.filter(p=>(p.name+" "+p.relationship+" "+p.notes).toLowerCase().includes(q));return`<div class="section-title"><h3>Search results for “${esc(q)}”</h3></div><div class="grid cols-3"><div class="card"><h3>Tasks</h3>${th.length?th.map(t=>`<p>${esc(t.title)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Documents</h3>${dh.length?dh.map(d=>`<p>${esc(d.name)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Timeline</h3>${eh.length?eh.map(e=>`<p>${esc(e.date)} — ${esc(e.title)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>Inbox</h3>${nh.length?nh.map(n=>`<p>${esc(n.text)}</p>`).join(""):`<p class="muted">No matches</p>`}</div><div class="card"><h3>People</h3>${ph.length?ph.map(p=>`<p>${esc(p.name)} — ${esc(p.relationship)}</p>`).join(""):`<p class="muted">No matches</p>`}</div></div>`}
function render(){const tm={home:"Command Center",inbox:"Inbox",actions:"Action Center",library:"Document Library",timeline:"Timeline",people:"People",settings:"Settings"};pageTitle.textContent=tm[currentPage]||currentPage[0].toUpperCase()+currentPage.slice(1);content.innerHTML=currentPage==="home"?dashboard():currentPage==="inbox"?inbox():currentPage==="actions"?actions():currentPage==="library"?library():currentPage==="timeline"?timeline():currentPage==="people"?people():currentPage==="settings"?settings():sectionPage(currentPage);bind()}
function bind(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go(b.dataset.open));document.querySelectorAll("[data-task-toggle]").forEach(c=>c.onchange=()=>{const t=data.tasks.find(x=>x.id===c.dataset.taskToggle);if(t){t.done=c.checked;save();render()}});document.querySelectorAll("[data-task-delete]").forEach(b=>b.onclick=()=>{data.tasks=data.tasks.filter(x=>x.id!==b.dataset.taskDelete);save();render()});document.querySelectorAll("[data-note-delete]").forEach(b=>b.onclick=()=>{data.notes=data.notes.filter(x=>x.id!==b.dataset.noteDelete);save();render()});document.querySelectorAll("[data-event-delete]").forEach(b=>b.onclick=()=>{data.events=data.events.filter(x=>x.id!==b.dataset.eventDelete);save();render()});document.querySelectorAll("[data-person-delete]").forEach(b=>b.onclick=()=>{data.people=data.people.filter(x=>x.id!==b.dataset.personDelete);save();render()});document.querySelectorAll("[data-doc-delete]").forEach(b=>b.onclick=()=>deleteDoc(b.dataset.docDelete));document.querySelectorAll("[data-doc-open]").forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.docOpen);if(d){const u=URL.createObjectURL(d.blob);window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000)}});if($("#addTaskBtn"))$("#addTaskBtn").onclick=()=>{const v=$("#newTaskInput").value.trim();if(v){data.tasks.unshift({id:Date.now().toString(),title:v,done:false,area:$("#taskArea").value});save();render();toast("Task added")}};if($("#saveNoteBtn"))$("#saveNoteBtn").onclick=()=>{const v=$("#noteInput").value.trim();if(v){data.notes.unshift({id:Date.now().toString(),text:v,created:new Date().toISOString()});save();render();toast("Saved to Inbox")}};if($("#addEventBtn"))$("#addEventBtn").onclick=()=>{const title=$("#eventTitle").value.trim(),date=$("#eventDate").value;if(title&&date){data.events.push({id:Date.now().toString(),title,date,area:$("#eventArea").value,details:$("#eventDetails").value.trim()});save();render();toast("Event added")}};if($("#addPersonBtn"))$("#addPersonBtn").onclick=()=>{const name=$("#personName").value.trim();if(name){data.people.push({id:Date.now().toString(),name,relationship:$("#personRelationship").value.trim(),notes:$("#personNotes").value.trim()});save();render();toast("Person added")}};if($("#docInput"))$("#docInput").onchange=async e=>{for(const f of e.target.files){const tags=(prompt(`Tags for ${f.name} (comma separated):`,"")||"").split(",").map(x=>x.trim()).filter(Boolean),area=prompt(`ATLAS area for ${f.name}:`,"General")||"General";await putDoc({id:Date.now().toString()+Math.random(),name:f.name,type:f.type||"application/octet-stream",size:f.size,created:new Date().toISOString(),tags,area,blob:f})}await loadDocs();toast("Files added")};if($("#clearDataBtn"))$("#clearDataBtn").onclick=()=>{if(confirm("Reset ATLAS metadata? Uploaded files will remain.")){data=JSON.parse(JSON.stringify(defaultData));save();go("home")}}}
function runCommand(raw){const text=raw.trim();if(!text)return;const cleaned=text.replace(/^atlas[,\s]*/i,"").trim(),lower=cleaned.toLowerCase();const nav=NAV.find(([id,,l])=>lower.includes(`open ${id}`)||lower.includes(`show ${id}`)||lower===id||lower.includes(l.toLowerCase()));if(nav&&/open|show|go to|take me|^medical$|^legal$|^housing$|^finance$|^vehicles$|^pets$|^people$|^knowledge$|^library$|^timeline$/.test(lower)){go(nav[0]);toast(`Opening ${nav[2]}`);return}const at=cleaned.match(/(?:add|create|make)(?: a)? task(?: to)? (.+)/i)||cleaned.match(/remind me to (.+)/i);if(at){data.tasks.unshift({id:Date.now().toString(),title:at[1].trim(),done:false,area:"General"});save();go("actions");toast("Task added");return}const an=cleaned.match(/(?:add|save|record)(?: a)? note(?: that)? (.+)/i);if(an){data.notes.unshift({id:Date.now().toString(),text:an[1].trim(),created:new Date().toISOString()});save();go("inbox");toast("Note saved");return}$("#globalSearch").value=cleaned;pageTitle.textContent="Search";content.innerHTML=searchResults(cleaned);toast("Search complete")}
let recognition=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang="en-US";recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{micBtn.classList.add("listening");voiceStatus.textContent="Listening…"};recognition.onresult=e=>{let text="";for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;commandInput.value=text;voiceStatus.textContent=e.results[e.results.length-1].isFinal?"Ready to run.":"Listening…"};recognition.onerror=e=>{voiceStatus.textContent=`Voice error: ${e.error}`;micBtn.classList.remove("listening")};recognition.onend=()=>{micBtn.classList.remove("listening");if(commandInput.value.trim())voiceStatus.textContent="Ready to run."}}else{voiceStatus.textContent="Voice recognition is not supported in this browser. Type your command instead.";micBtn.disabled=true}
micBtn.onclick=()=>{if(recognition){commandInput.value="";recognition.start()}};$("#runCommandBtn").onclick=()=>runCommand(commandInput.value);$("#globalSearch").addEventListener("input",e=>{pageTitle.textContent=e.target.value?"Search":"Command Center";content.innerHTML=searchResults(e.target.value);bind()});$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");$("#themeBtn").onclick=()=>{document.documentElement.classList.toggle("light");localStorage.setItem("atlasTheme",document.documentElement.classList.contains("light")?"light":"dark")};if(localStorage.getItem("atlasTheme")==="light")document.documentElement.classList.add("light");
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ATLAS-0.2-metadata.json";a.click();URL.revokeObjectURL(a.href)};$("#importInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{data=JSON.parse(await f.text());save();go("home");toast("Metadata imported")}catch{alert("That file is not valid ATLAS JSON.")}};
