function atlasClientContext(){

function safeAtlasArgs(args){
  if(args&&typeof args==="object")return args;
  if(typeof args==="string"){try{return JSON.parse(args)}catch{return {}}}
  return {};
}
async function executeAtlasTool(name,args){
  args=safeAtlasArgs(args);
  const clean=v=>String(v??"").trim();
  const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(clean(v))?clean(v):"";
  const priority=v=>["high","medium","low"].includes(clean(v).toLowerCase())?clean(v).toLowerCase():"medium";
  const category=v=>{
    const wanted=clean(v)||"General";
    const existing=allCategories().find(x=>x.toLowerCase()===wanted.toLowerCase());
    if(existing)return existing;
    customCategories.push(wanted);
    localStorage.setItem("atlasCustomCategories",JSON.stringify(customCategories));
    return wanted;
  };

  if(name==="create_task"){
    const title=clean(args.title);if(!title)return {ok:false,error:"Task title is required."};
    const task={id:uid("task"),title,done:false,area:category(args.area),due:validDate(args.due),priority:priority(args.priority)};
    data.tasks.unshift(task);save();toast("Task added: "+task.title);
    return {ok:true,action:"created_task",task};
  }
  if(name==="update_task"){
    const t=data.tasks.find(x=>x.id===clean(args.task_id));
    if(!t)return {ok:false,error:"Task not found. Use search_atlas first to get the task ID."};
    if(args.title!==undefined&&clean(args.title))t.title=clean(args.title);
    if(args.area!==undefined&&clean(args.area))t.area=category(args.area);
    if(args.due!==undefined)t.due=validDate(args.due);
    if(args.priority!==undefined)t.priority=priority(args.priority);
    save();toast("Task updated: "+t.title);
    return {ok:true,action:"updated_task",task:t};
  }
  if(name==="set_task_status"){
    const t=data.tasks.find(x=>x.id===clean(args.task_id));
    if(!t)return {ok:false,error:"Task not found. Use search_atlas first to get the task ID."};
    t.done=!!args.completed;save();toast((t.done?"Completed: ":"Reopened: ")+t.title);
    return {ok:true,action:t.done?"completed_task":"reopened_task",task:t};
  }
  if(name==="create_note"){
    const text=clean(args.text);if(!text)return {ok:false,error:"Note text is required."};
    const note={id:uid("note"),text,created:new Date().toISOString()};
    data.notes.unshift(note);save();toast("Saved to Inbox");
    return {ok:true,action:"created_note",note};
  }
  if(name==="create_timeline_event"){
    const title=clean(args.title),date=validDate(args.date);
    if(!title||!date)return {ok:false,error:"Timeline event needs a title and YYYY-MM-DD date."};
    const event={id:uid("event"),title,date,area:category(args.area),details:clean(args.details)};
    data.events.push(event);save();toast("Timeline event added: "+title);
    return {ok:true,action:"created_timeline_event",event};
  }
  if(name==="create_record"){
    const title=clean(args.title);if(!title)return {ok:false,error:"Record title is required."};
    const tags=Array.isArray(args.tags)?args.tags.map(clean).filter(Boolean):clean(args.tags).split(",").map(x=>x.trim()).filter(Boolean);
    const record={id:uid("record"),title,area:category(args.area),type:clean(args.type)||"General",date:validDate(args.date),tags,details:clean(args.details),created:new Date().toISOString()};
    data.records.unshift(record);save();toast("Record saved: "+title);
    return {ok:true,action:"created_record",record};
  }
  if(name==="create_person"){
    const personName=clean(args.name);if(!personName)return {ok:false,error:"Person name is required."};
    const person={id:uid("person"),name:personName,relationship:clean(args.relationship),notes:clean(args.notes)};
    data.people.push(person);save();toast("Person added: "+personName);
    return {ok:true,action:"created_person",person};
  }
  if(name==="search_atlas"){
    const q=clean(args.query).toLowerCase();if(!q)return {ok:false,error:"Search query is required."};
    const scope=clean(args.scope).toLowerCase()||"all";
    const hit=v=>String(v??"").toLowerCase().includes(q);
    const out={query:q,scope};
    if(scope==="all"||scope==="tasks")out.tasks=data.tasks.filter(t=>hit([t.title,t.area,t.priority,t.due].join(" "))).slice(0,25);
    if(scope==="all"||scope==="notes")out.notes=data.notes.filter(n=>hit(n.text)).slice(0,25);
    if(scope==="all"||scope==="events")out.events=data.events.filter(e=>hit([e.title,e.area,e.details,e.date].join(" "))).slice(0,25);
    if(scope==="all"||scope==="records")out.records=data.records.filter(r=>hit([r.title,r.area,r.type,r.details,(r.tags||[]).join(" ")].join(" "))).slice(0,25);
    if(scope==="all"||scope==="people")out.people=data.people.filter(p=>hit([p.name,p.relationship,p.notes].join(" "))).slice(0,25);
    if(scope==="all"||scope==="documents")out.documents=docs.filter(d=>hit([d.name,d.area,(d.tags||[]).join(" ")].join(" "))).slice(0,25).map(d=>({id:d.id,name:d.name,area:d.area,tags:d.tags,type:d.type,created:d.created}));
    return {ok:true,action:"search_results",results:out};
  }
  return {ok:false,error:"Unknown ATLAS action tool: "+name};
}
async function handleRealtimeToolCalls(calls){
  if(!Array.isArray(calls)||!calls.length||!atlasVoice.dc)return;
  setVoiceStatus("thinking");
  for(const call of calls){
    let result;
    try{result=await executeAtlasTool(call.name,call.arguments)}
    catch(err){result={ok:false,error:err.message||String(err)}}
    atlasVoice.dc.send(JSON.stringify({
      type:"conversation.item.create",
      item:{type:"function_call_output",call_id:call.call_id,output:JSON.stringify(result)}
    }));
  }
  atlasVoice.dc.send(JSON.stringify({type:"response.create"}));
}
async function handleRealtimeResponseDone(event){
  if(event?.response?.status!=="completed"){
    if(atlasVoice.active)setVoiceStatus("listening");
    return;
  }
  const calls=(event.response.output||[]).filter(x=>x?.type==="function_call"&&x.call_id&&x.name);
  if(calls.length){await handleRealtimeToolCalls(calls);return}
  if(atlasVoice.active)setVoiceStatus("listening");
}

function atlasVoiceControlIntent(text){
  let v=String(text||"").toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
  v=v.replace(/^(?:um|uh|erm|hmm|hey|okay|ok)\s+/,"");

  // End the live session. Keep this fairly strict so normal sentences about saying goodbye do not end ATLAS.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:good\s*bye|bye|end(?: the)? voice|stop(?: the)? voice|end(?: the)? session)(?:\s+atlas)?$/.test(v))return "end";

  // Mute/pause listening. Accept both direct commands and natural requests such as
  // “are you able to mute?”, “can you pause listening?”, or “stop listening please”.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:mute|pause|mute listening|pause listening|stop listening|stop hearing me)(?:\s+(?:please|atlas))?$/.test(v))return "mute";
  if(/^(?:atlas\s+)?(?:are you able to|can you|could you|would you|will you|would you please|could you please|can you please)\s+(?:mute|pause|mute listening|pause listening|stop listening|stop hearing me)(?:\s+(?:please|atlas))?$/.test(v))return "mute";
  if(/^(?:atlas\s+)?(?:please\s+)?(?:mute|pause)\s+(?:yourself|the mic|the microphone|your mic|your microphone|listening)(?:\s+(?:please|atlas))?$/.test(v))return "mute";

  // Resume listening. These are mainly useful when typed because a truly muted microphone cannot hear a voice command.
  if(/^(?:atlas\s+)?(?:please\s+)?(?:unmute|listen|resume|resume listening|start listening|listen again|start listening again)(?:\s+(?:please|atlas))?$/.test(v))return "unmute";
  if(/^(?:atlas\s+)?(?:can you|could you|would you|will you)\s+(?:unmute|listen|resume listening|start listening|listen again)(?:\s+(?:please|atlas))?$/.test(v))return "unmute";
  return "";
}
function cancelAtlasVoiceResponse(){

async function setAtlasListening(shouldListen,{cancelResponse=false,quiet=false}={}){
  if(!atlasVoice.active||!atlasVoice.sender)return false;
  if(shouldListen&&!atlasVoice.muted){if(!quiet)toast("ATLAS is already listening");return true}
  if(!shouldListen&&atlasVoice.muted){if(!quiet)toast("ATLAS microphone is already paused");return true}

  if(!shouldListen){
    if(cancelResponse)cancelAtlasVoiceResponse();

    // Hard-stop microphone capture FIRST. This is the primary mute and is deliberately
    // independent of replaceTrack(null), which can behave inconsistently on mobile Safari.
    try{
      const senderTrack=atlasVoice.sender.track;
      if(senderTrack)senderTrack.enabled=false;
    }catch{}
    try{
      atlasVoice.stream?.getAudioTracks().forEach(track=>{
        try{track.enabled=false}catch{}
        try{track.stop()}catch{}
      });
    }catch{}

    // Clear any audio already queued for the Realtime session, then detach the ended track.
    try{
      if(atlasVoice.dc?.readyState==="open"){
        atlasVoice.dc.send(JSON.stringify({type:"input_audio_buffer.clear"}));
      }
    }catch{}
    try{await atlasVoice.sender.replaceTrack(null)}catch(err){console.warn("ATLAS replaceTrack(null) fallback:",err)}

    atlasVoice.stream=null;
    atlasVoice.muted=true;
    setVoiceStatus("paused");
    if(!quiet)toast("ATLAS paused • microphone capture stopped");
    return true;
  }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const track=stream.getAudioTracks()[0];
    if(!track)throw new Error("No microphone track was available.");
    track.enabled=true;
    await atlasVoice.sender.replaceTrack(track);
    atlasVoice.stream=stream;
    atlasVoice.muted=false;
    setVoiceStatus("listening");
    if(!quiet)toast("ATLAS is listening again");
    return true;
  }catch(err){
    console.error(err);
    toast("Microphone resume failed: "+(err.message||err));
    return false;
  }
}

async function runLocalVoiceControl(intent,{source="typed"}={}){

  }
  if(intent==="mute"){
    if(!atlasVoice.active)return "Voice is not currently running.";
    const ok=await setAtlasListening(false,{cancelResponse:source==="spoken"});
    return ok?"Listening paused. Microphone capture is stopped.":"I could not pause the microphone.";
  }
  if(intent==="unmute"){
    if(atlasVoice.active){
      const ok=await setAtlasListening(true);
      return ok?"Listening resumed.":"I could not resume the microphone.";
    }
    await startAtlasVoice();

  }

}
function handleRealtimeEvent(event){
  if(!event||!event.type)return;
  if(event.type==="input_audio_buffer.speech_started"){if(!atlasVoice.muted)setVoiceStatus("listening");return}
  if(event.type==="input_audio_buffer.speech_stopped"){if(!atlasVoice.muted)setVoiceStatus("thinking");return}
  if(event.type==="response.created"){atlasVoice.responseActive=true;if(!atlasVoice.muted)setVoiceStatus("thinking");return}
  if(event.type==="response.output_audio_transcript.delta"||event.type==="response.output_audio.delta"){if(!atlasVoice.muted)setVoiceStatus("speaking");return}
  if(event.type==="response.output_audio_transcript.done"){appendAtlasTranscript("assistant",event.transcript);return}
  if(event.type==="conversation.item.input_audio_transcription.completed"){
    appendAtlasTranscript("user",event.transcript);
    const intent=atlasVoiceControlIntent(event.transcript);
    if(intent){runLocalVoiceControl(intent,{source:"spoken"});return}
    return;
  }
  if(event.type==="response.done"){atlasVoice.responseActive=false;handleRealtimeResponseDone(event);return}
  if(event.type==="response.output_audio.done"){return}
  if(event.type==="error"){console.error("ATLAS realtime error",event);toast(event.error?.message||"ATLAS voice error");return}
}
async function startAtlasVoice(){

    if(!sdpRes.ok)throw new Error(`Realtime connection failed (${sdpRes.status}): ${await sdpRes.text()}`);

async function sendAtlasMessage(){

  const box=$("#atlasMessage");
  const message=(box?.value||"").trim();
  if(!message)return;
  const controlIntent=atlasVoiceControlIntent(message);
  if(controlIntent){
    atlasChat.push({role:"user",content:message,at:new Date().toISOString(),source:"control"});
    const result=await runLocalVoiceControl(controlIntent,{source:"typed"});
    atlasChat.push({role:"assistant",content:result,at:new Date().toISOString(),source:"control"});
    saveAtlasChat();render();
    return;
  }
  const password=brainPassword();
  if(!password)return;
  const history=atlasChat.slice(-12).map(m=>({role:m.role,content:m.content}));
  atlasChat.push({role:"user",content:message,at:new Date().toISOString()});
  saveAtlasChat();atlasSending=true;render();

  const callApi=async payload=>{
    const res=await fetch(ATLAS_API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Atlas-Password":password},
      body:JSON.stringify(payload)
    });
    const body=await res.json().catch(()=>({}));
    if(res.status===401){
      localStorage.removeItem("atlasBrainPassword");
      throw new Error("That ATLAS access password was rejected. Please unlock ATLAS again.");
    }
    if(!res.ok)throw new Error(body.detail||body.error||("ATLAS server returned "+res.status+"."));

  };

    let body=await callApi({message,history,client_context:atlasClientContext()});
    let rounds=0;

      const tool_results=[];
      for(const call of body.action_calls){
        let result;
        try{result=await executeAtlasTool(call.name,call.arguments)}
        catch(err){result={ok:false,error:err.message||String(err)}}
        tool_results.push({call_id:call.call_id||"",name:call.name,result});
      }
      rounds++;
      body=await callApi({message,history,client_context:atlasClientContext(),tool_results,action_round:rounds});
    }
    if(Array.isArray(body.action_calls)&&body.action_calls.length){
      throw new Error("ATLAS stopped an unusually long action chain for safety. Please try the request again more specifically.");
    }
    atlasChat.push({role:"assistant",content:body.reply||"The ATLAS action completed.",at:new Date().toISOString()});
    saveAtlasChat();
  }catch(err){
    atlasChat.push({role:"assistant",content:"Connection error: "+err.message,at:new Date().toISOString()});
    saveAtlasChat();
  }finally{
    atlasSending=false;render();
    setTimeout(()=>{const w=$("#atlasChatWindow");if(w)w.scrollTop=w.scrollHeight},40);
  }
}

if($("#atlasUnlockBtn"))$("#atlasUnlockBtn").onclick=()=>{const p=($("#atlasPasswordInput")?.value||"").trim();if(!p)return;localStorage.setItem("atlasBrainPassword",p);render();toast("ATLAS Brain unlocked")};
if($("#atlasSendBtn"))$("#atlasSendBtn").onclick=()=>sendAtlasMessage();
if($("#atlasMessage"))$("#atlasMessage").onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();sendAtlasMessage()}};
if($("#atlasDictateBtn"))$("#atlasDictateBtn").onclick=()=>startAtlasDictation();
if($("#atlasVoiceBtn"))$("#atlasVoiceBtn").onclick=()=>atlasVoice.active?endAtlasVoice():startAtlasVoice();
if($("#atlasMuteBtn"))$("#atlasMuteBtn").onclick=()=>toggleAtlasMute();
if($("#atlasVoiceSelect"))$("#atlasVoiceSelect").onchange=e=>{atlasVoice.voice=e.target.value;localStorage.setItem("atlasVoiceName",atlasVoice.voice)};
if($("#atlasClearBtn"))$("#atlasClearBtn").onclick=()=>{if(confirm("Clear the ATLAS conversation on this device?")){atlasChat=[];saveAtlasChat();render();toast("Conversation cleared")}};
if($("#atlasForgetBtn"))$("#atlasForgetBtn").onclick=()=>{localStorage.removeItem("atlasBrainPassword");render();toast("ATLAS password forgotten on this device")};
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go(b.dataset.open));
document.querySelectorAll("[data-task-check]").forEach(b=>b.onclick=()=>{const id=b.dataset.taskCheck,t=data.tasks.find(x=>x.id===id);if(!t)return;const becomingDone=!t.done,row=b.closest(".list-item");b.classList.toggle("checked",becomingDone);b.classList.add("animating");if(row)row.classList.add("task-finishing");setTimeout(()=>{t.done=becomingDone;save();render();toast(becomingDone?"Task completed":"Task moved back to open tasks")},430)});
document.querySelectorAll("[data-task-action]").forEach(s=>s.onchange=()=>{const id=s.dataset.taskAction,action=s.value,t=data.tasks.find(x=>x.id===id);if(!t)return;if(action==="edit"){editingTaskId=id;go("actions");setTimeout(()=>$("#newTaskInput")?.focus(),50);return}if(action==="complete"){t.done=true;save();render();toast("Task marked completed");return}if(action==="incomplete"){t.done=false;save();render();toast("Task moved to open tasks");return}if(action==="delete"){if(confirm(`Delete "${t.title}"?`)){data.tasks=data.tasks.filter(x=>x.id!==id);if(editingTaskId===id)editingTaskId=null;save();render();toast("Task deleted")}else{s.value=""}}});
document.querySelectorAll("[data-note-delete]").forEach(b=>b.onclick=()=>{data.notes=data.notes.filter(x=>x.id!==b.dataset.noteDelete);save();render()});
document.querySelectorAll("[data-event-delete]").forEach(b=>b.onclick=()=>{data.events=data.events.filter(x=>x.id!==b.dataset.eventDelete);save();render()});
document.querySelectorAll("[data-person-delete]").forEach(b=>b.onclick=()=>{data.people=data.people.filter(x=>x.id!==b.dataset.personDelete);save();render()});
document.querySelectorAll("[data-record-delete]").forEach(b=>b.onclick=()=>{data.records=data.records.filter(x=>x.id!==b.dataset.recordDelete);save();render()});
document.querySelectorAll("[data-doc-delete]").forEach(b=>b.onclick=()=>deleteDoc(b.dataset.docDelete));
document.querySelectorAll("[data-doc-open]").forEach(b=>b.onclick=()=>{const d=docs.find(x=>x.id===b.dataset.docOpen);if(d){const u=URL.createObjectURL(d.blob);window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000)}});
if($("#addTaskBtn"))$("#addTaskBtn").onclick=()=>{const v=$("#newTaskInput").value.trim();if(v){const addCal=$("#taskCalendar").checked,due=$("#taskDue").value;if(addCal&&!due){alert("Choose a Due Date before adding this task to your calendar.");return}const category=($("#taskArea").value&&$("#taskArea").value!=="__new__")?$("#taskArea").value:"General";if(editingTaskId){const task=data.tasks.find(x=>x.id===editingTaskId);if(task){task.title=v;task.area=category;task.due=due;task.priority=$("#taskPriority").value;save();if(addCal)addToIPhoneCalendar(task);editingTaskId=null;render();toast("Task updated")}return}const task={id:uid("task"),title:v,done:false,area:category,due,priority:$("#taskPriority").value};data.tasks.unshift(task);save();if(addCal)addToIPhoneCalendar(task);render();toast("Task added")}};
if($("#cancelTaskEdit"))$("#cancelTaskEdit").onclick=()=>{editingTaskId=null;render();toast("Editing cancelled")};
if($("#saveNoteBtn"))$("#saveNoteBtn").onclick=()=>{const v=$("#noteInput").value.trim();if(v){data.notes.unshift({id:uid("note"),text:v,created:new Date().toISOString()});save();render();toast("Saved to Inbox")}};
if($("#addEventBtn"))$("#addEventBtn").onclick=()=>{const title=$("#eventTitle").value.trim(),date=$("#eventDate").value;if(title&&date){data.events.push({id:uid("event"),title,date,area:$("#eventArea").value,details:$("#eventDetails").value.trim()});save();render();toast("Event added")}};
if($("#addPersonBtn"))$("#addPersonBtn").onclick=()=>{const name=$("#personName").value.trim();if(name){data.people.push({id:uid("person"),name,relationship:$("#personRelationship").value.trim(),notes:$("#personNotes").value.trim()});save();render();toast("Person added")}};
if($("#addRecordBtn"))$("#addRecordBtn").onclick=()=>{const title=$("#recordTitle").value.trim();if(title){data.records.unshift({id:uid("record"),title,area:$("#addRecordBtn").dataset.area,type:$("#recordType").value,date:$("#recordDate").value,tags:$("#recordTags").value.split(",").map(x=>x.trim()).filter(Boolean),details:$("#recordDetails").value.trim(),created:new Date().toISOString()});save();render();toast("Record saved")}};
if($("#docInput"))$("#docInput").onchange=async e=>{for(const f of e.target.files){const tags=(prompt(`Tags for ${f.name} (comma separated):`,"")||"").split(",").map(x=>x.trim()).filter(Boolean),area=prompt(`ATLAS area for ${f.name}:`,"General")||"General";await putDoc({id:uid("doc"),name:f.name,type:f.type||"application/octet-stream",size:f.size,created:new Date().toISOString(),tags,area,blob:f})}await loadDocs();toast("Files added")};
if($("#clearDataBtn"))$("#clearDataBtn").onclick=()=>{if(confirm("Reset ATLAS metadata? Uploaded files will remain.")){data=clone(defaults);save();go("home")}}
}
function runCommand(raw){const text=raw.trim();if(!text)return;const cleaned=text.replace(/^atlas[,\s]*/i,"").trim(),lower=cleaned.toLowerCase();const nav=NAV.find(([id,,l])=>lower.includes(`open ${id}`)||lower.includes(`show ${id}`)||lower===id||lower.includes(l.toLowerCase()));if(nav&&/open|show|go to|take me|^medical$|^legal$|^housing$|^finance$|^vehicles$|^pets$|^people$|^knowledge$|^library$|^timeline$/.test(lower)){go(nav[0]);toast(`Opening ${nav[2]}`);return}const at=cleaned.match(/(?:add|create|make)(?: a)? task(?: to)? (.+)/i)||cleaned.match(/remind me to (.+)/i);if(at){data.tasks.unshift({id:uid("task"),title:at[1].trim(),done:false,area:"General",due:"",priority:"medium"});save();go("actions");toast("Task added");return}const an=cleaned.match(/(?:add|save|record)(?: a)? note(?: that)? (.+)/i);if(an){data.notes.unshift({id:uid("note"),text:an[1].trim(),created:new Date().toISOString()});save();go("inbox");toast("Note saved");return}$("#globalSearch").value=cleaned;pageTitle.textContent="Search";content.innerHTML=searchResults(cleaned);bind();toast("Search complete")}
let recognition=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang="en-US";recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{micBtn.classList.add("listening");voiceStatus.textContent="Listening…"};recognition.onresult=e=>{let text="";for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;commandInput.value=text;voiceStatus.textContent=e.results[e.results.length-1].isFinal?"Ready to run.":"Listening…"};recognition.onerror=e=>{voiceStatus.textContent=`Voice error: ${e.error}`;micBtn.classList.remove("listening")};recognition.onend=()=>{micBtn.classList.remove("listening");if(commandInput.value.trim())voiceStatus.textContent="Ready to run."}}else{voiceStatus.textContent="Voice recognition is not supported here. Type your command instead.";micBtn.disabled=true}
micBtn.onclick=()=>{if(recognition){commandInput.value="";recognition.start()}};
$("#runCommandBtn").onclick=()=>runCommand(commandInput.value);
$("#globalSearch").addEventListener("input",e=>{pageTitle.textContent=e.target.value?"Search":"Command Center";content.innerHTML=searchResults(e.target.value);bind()});
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
$("#themeBtn").onclick=()=>{document.documentElement.classList.toggle("light");localStorage.setItem("atlasTheme",document.documentElement.classList.contains("light")?"light":"dark")};
if(localStorage.getItem("atlasTheme")==="light")document.documentElement.classList.add("light");
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ATLAS-0.6.2-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("#importInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{data=normalize(JSON.parse(await f.text()));save();go("home");toast("Backup imported")}catch{alert("That file is not valid ATLAS JSON.")}};
greet();renderNav();render();loadDocs();
</script>
</body>
</html>
